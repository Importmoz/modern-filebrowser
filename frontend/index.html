<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaDrive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   NOVA DESIGN SYSTEM - FLUID, CURVED, ANIMATED
   ============================================================================ */
:root {
  --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* Color Palette - Deep Dark Glass */
  --bg-app: #08080b;
  --bg-sidebar: rgba(14, 15, 20, 0.65);
  --bg-main: rgba(10, 11, 15, 0.5);
  --bg-card: rgba(255, 255, 255, 0.025);
  --bg-card-hover: rgba(255, 255, 255, 0.06);
  --bg-card-active: rgba(255, 255, 255, 0.09);

  --border: rgba(255, 255, 255, 0.06);
  --border-subtle: rgba(255, 255, 255, 0.03);

  --text-primary: #ffffff;
  --text-secondary: #9ca3af;
  --text-tertiary: #6b7280;

  /* Brand Colors */
  --accent: #8b5cf6;
  --accent-hover: #a78bfa;
  --accent-glow: rgba(139, 92, 246, 0.3);
  --accent-soft: rgba(139, 92, 246, 0.1);
  
  --system-red: #ef4444;
  --system-green: #10b981;
  --system-blue: #3b82f6;

  /* Ultra Curved Radii */
  --radius-xs: 12px;
  --radius-sm: 18px;
  --radius-md: 24px;
  --radius-lg: 32px;
  --radius-xl: 40px;
  --radius-full: 999px;

  --shadow-float: 0 10px 30px -10px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.2);

  --blur: blur(40px) saturate(200%);
  --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  --bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }

body {
  font-family: var(--font-sans);
  background-color: var(--bg-app);
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
  user-select: none;
}

/* Background Atmosphere */
.bg-glow {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.bg-glow-1 {
  position: absolute;
  top: -20%; left: -10%;
  width: 60vw; height: 60vw;
  background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 60%);
  filter: blur(100px);
  animation: pulseGlow 15s ease-in-out infinite alternate;
}
.bg-glow-2 {
  position: absolute;
  bottom: -20%; right: -10%;
  width: 50vw; height: 50vw;
  background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
  filter: blur(100px);
  animation: pulseGlow 20s ease-in-out infinite alternate-reverse;
}

@keyframes pulseGlow {
  0% { transform: scale(0.9) translate(0, 0); opacity: 0.7; }
  100% { transform: scale(1.1) translate(5%, 5%); opacity: 1; }
}

/* ============================================================================
   SVG ICON SYSTEM
   ============================================================================ */
.svg-icon {
  width: 20px;
  height: 20px;
  stroke-width: 2;
  stroke: currentColor;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: inline-block;
  vertical-align: middle;
  transition: var(--bounce);
}
.svg-icon.lg { width: 26px; height: 26px; }
.svg-icon.xl { width: 48px; height: 48px; }

/* ============================================================================
   LOGIN SCREEN
   ============================================================================ */
.login-wrapper {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(8, 8, 11, 0.95);
  backdrop-filter: var(--blur);
  transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.login-wrapper.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(1.05);
}

.login-card {
  width: 400px;
  padding: 48px 40px;
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-float);
  text-align: center;
  position: relative;
  overflow: hidden;
  animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards;
}

@keyframes floatUp {
  0% { opacity: 0; transform: translateY(40px) scale(0.95); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.login-brand {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 72px; height: 72px;
  border-radius: var(--radius-md);
  background: var(--accent-soft);
  color: var(--accent);
  margin-bottom: 24px;
  border: 1px solid var(--accent-glow);
  box-shadow: var(--shadow-glow);
}
.login-brand svg { animation: floatIcon 3s ease-in-out infinite; }

@keyframes floatIcon {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.login-card h1 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 8px;
}
.login-card p {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 32px;
}

.field {
  margin-bottom: 20px;
  text-align: left;
}
.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 8px;
  padding-left: 4px;
}
.field input {
  width: 100%;
  padding: 16px 20px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 15px;
  outline: none;
  transition: var(--bounce);
}
.field input:focus {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.05);
  box-shadow: 0 0 0 4px var(--accent-soft);
  transform: scale(1.02);
}

.btn-primary {
  width: 100%;
  padding: 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-full);
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--bounce);
  margin-top: 12px;
}
.btn-primary:hover {
  background: var(--accent-hover);
  transform: translateY(-2px) scale(1.02);
  box-shadow: var(--shadow-glow);
}
.btn-primary:active { transform: translateY(1px) scale(0.98); }

.login-err {
  margin-top: 16px;
  padding: 12px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  border-radius: var(--radius-full);
  color: var(--system-red);
  font-size: 13px;
  display: none;
  animation: shake 0.4s ease-in-out;
}
.login-err.show { display: block; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* ============================================================================
   APP LAYOUT
   ============================================================================ */
.app-container {
  display: flex;
  height: 100vh;
  width: 100vw;
  position: relative;
  z-index: 1;
}

/* SIDEBAR */
.sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg-sidebar);
  backdrop-filter: var(--blur);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  gap: 24px;
  transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1), min-width 0.3s cubic-bezier(0.25, 1, 0.5, 1), padding 0.3s;
  overflow: hidden;
}

.sidebar.collapsed {
  width: 80px;
  min-width: 80px;
  padding: 24px 0;
  align-items: center;
}

.sidebar.collapsed .brand-title {
  justify-content: center !important;
  width: auto !important;
  padding: 0 !important;
  margin-bottom: 12px;
}

.sidebar.collapsed .brand-title span,
.sidebar.collapsed .nav-section-title,
.sidebar.collapsed .nav-btn span,
.sidebar.collapsed .nav-btn .lock-icon,
.sidebar.collapsed .storage-info,
.sidebar.collapsed .storage-track,
.sidebar.collapsed .storage-widget {
  display: none !important;
}

.sidebar.collapsed .nav-group {
  align-items: center;
  width: 100%;
}

.sidebar.collapsed .nav-btn {
  justify-content: center;
  width: 48px;
  height: 48px;
  padding: 0;
  border-radius: var(--radius-full);
}

.sidebar.collapsed .nav-btn .svg-icon {
  margin: 0;
}

/* Overlay da gaveta (mobile/tablet) — base global */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 199;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
}
.sidebar-overlay.active { display: block; }

.brand-title {
  font-size: 20px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px 12px;
  color: var(--text-primary);
}
.brand-title .svg-icon { color: var(--accent); }

.nav-section-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-tertiary);
  padding: 0 12px 8px;
}

.nav-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 600;
  background: transparent;
  border: none;
  cursor: pointer;
  transition: var(--bounce);
  width: 100%;
  text-align: left;
}
.nav-btn:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
  transform: translateX(4px);
}
.nav-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
}
.nav-btn:hover .svg-icon { transform: scale(1.15) rotate(-5deg); }

.sidebar-spacer { flex: 1; }

.storage-widget {
  padding: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  transition: var(--bounce);
}
.storage-widget:hover {
  background: var(--bg-card-hover);
  transform: translateY(-2px);
}
.storage-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  font-weight: 600;
}
.storage-track {
  height: 6px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.storage-fill {
  height: 100%;
  background: var(--accent);
  border-radius: var(--radius-full);
  transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

/* MAIN CONTENT AREA */
.content-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg-main);
  min-width: 0;
}

/* TOP TOOLBAR */
.toolbar {
  height: 72px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: rgba(10, 11, 15, 0.4);
  backdrop-filter: var(--blur);
  gap: 14px;
}

.toolbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 1;
  min-width: 0;
}

.btn-icon-soft {
  width: 40px; height: 40px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--bounce);
}
.btn-icon-soft:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
  transform: scale(1.05);
}

/* Curved Pill Breadcrumb */
.breadcrumb-trail {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--bg-card);
  padding: 6px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
}
.breadcrumb-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--bounce);
  white-space: nowrap;
}
.breadcrumb-item:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
}
.breadcrumb-item.active {
  background: var(--bg-card-active);
  color: var(--text-primary);
  font-weight: 700;
}
.breadcrumb-sep {
  color: var(--text-tertiary);
  font-size: 12px;
}

.toolbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Search Input */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  width: 270px;
  transition: var(--bounce);
  position: relative;
}
.search-bar:focus-within {
  width: 340px;
  border-color: var(--accent);
  background: var(--bg-card-hover);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.search-bar input {
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 13px;
  width: 100%;
  font-family: var(--font-sans);
}
.search-bar input::placeholder { color: var(--text-tertiary); }
.search-bar .svg-icon { color: var(--text-secondary); flex-shrink: 0; }

.search-scope-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-full);
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  cursor: pointer;
  white-space: nowrap;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.search-scope-btn:hover {
  background: var(--accent-soft);
  color: var(--accent-hover);
  border-color: var(--accent-glow);
}
.search-scope-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}

.search-clear-btn {
  background: none;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  padding: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: var(--transition);
}
.search-clear-btn:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.1);
}

/* Search Banner */
.search-banner {
  background: rgba(139, 92, 246, 0.08);
  border: 1px solid rgba(139, 92, 246, 0.2);
  border-radius: var(--radius-md);
  padding: 14px 20px;
  margin-bottom: 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  animation: slideIn 0.3s ease;
}
.search-banner-info {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--text-primary);
}
.search-banner-info strong { color: var(--accent-hover); }
.search-banner-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.filter-chip {
  padding: 5px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--bounce);
}
.filter-chip:hover {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-primary);
}
.filter-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 0 12px var(--accent-glow);
}
.btn-clear-search {
  padding: 5px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 600;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: var(--system-red);
  cursor: pointer;
  transition: var(--bounce);
}
.btn-clear-search:hover {
  background: rgba(239, 68, 68, 0.2);
}

.search-dir-badge {
  font-size: 11px;
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  gap: 4px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 2px;
}

/* Sortable column header */
.sortable-col {
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: var(--transition);
}
.sortable-col:hover {
  color: var(--text-primary);
}
.sort-indicator {
  font-size: 11px;
  color: var(--accent);
}

/* Space Analyzer Modal & Styles */
.analyzer-modal {
  max-width: 860px;
  width: 90vw;
}
.heaviest-spotlight {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(59, 130, 246, 0.1) 100%);
  border: 1px solid var(--accent-glow);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  box-shadow: var(--shadow-glow);
  position: relative;
  overflow: hidden;
}
.heaviest-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: rgba(245, 158, 11, 0.15);
  border: 1px solid rgba(245, 158, 11, 0.3);
  color: #fbbf24;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.heaviest-title {
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.heaviest-path {
  font-size: 12px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
}
.heaviest-stat {
  text-align: right;
  flex-shrink: 0;
}
.heaviest-size {
  font-size: 24px;
  font-weight: 800;
  color: var(--accent-hover);
}
.heaviest-percent {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 600;
}

.analyzer-stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.analyzer-stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
}
.analyzer-stat-card .label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.analyzer-stat-card .val {
  font-size: 17px;
  font-weight: 800;
  color: var(--text-primary);
}

.analyzer-tabs {
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 10px;
  margin-bottom: 16px;
  overflow-x: auto;
}
.analyzer-tab-btn {
  padding: 8px 16px;
  border-radius: var(--radius-full);
  background: none;
  border: 1px solid transparent;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--bounce);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.analyzer-tab-btn:hover {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-primary);
}
.analyzer-tab-btn.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}

.analyzer-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 48vh;
  overflow-y: auto;
  padding-right: 4px;
}
.analyzer-row {
  display: grid;
  grid-template-columns: 36px 1fr 120px 100px 90px;
  align-items: center;
  padding: 10px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  transition: var(--bounce);
  gap: 12px;
}
.analyzer-row:hover {
  background: var(--bg-card-hover);
  border-color: var(--border);
  transform: translateX(3px);
}
.analyzer-rank {
  font-size: 13px;
  font-weight: 800;
  color: var(--text-tertiary);
  text-align: center;
}
.analyzer-rank.gold { color: #f59e0b; }
.analyzer-rank.silver { color: #94a3b8; }
.analyzer-rank.bronze { color: #d97706; }

.analyzer-row-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.analyzer-row-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.analyzer-row-sub {
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 2px;
}
.analyzer-bar-col {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.analyzer-mini-bar {
  height: 6px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.analyzer-mini-bar-fill {
  height: 100%;
  border-radius: var(--radius-full);
  background: linear-gradient(90deg, #3b82f6, #8b5cf6);
  transition: width 0.6s ease;
}
.analyzer-mini-bar-fill.heavy {
  background: linear-gradient(90deg, #f59e0b, #ef4444);
}
.analyzer-bar-percent {
  font-size: 10px;
  color: var(--text-tertiary);
  font-weight: 600;
}
.analyzer-row-size {
  font-size: 13px;
  font-weight: 800;
  color: var(--text-primary);
  text-align: right;
}
.analyzer-row-action button {
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 700;
  border-radius: var(--radius-full);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  color: var(--text-primary);
  cursor: pointer;
  transition: var(--bounce);
  width: 100%;
}
.analyzer-row-action button:hover {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: var(--shadow-glow);
}

/* View Mode Segmented Control */
.segmented-control {
  display: flex;
  padding: 4px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
}
.segmented-btn {
  padding: 6px 12px;
  border-radius: var(--radius-full);
  border: none;
  background: none;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--bounce);
  display: flex;
  align-items: center;
}
.segmented-btn.active {
  background: rgba(255, 255, 255, 0.1);
  color: var(--text-primary);
}

/* FILE VIEWPORT */
.viewport {
  flex: 1;
  overflow-y: auto;
  padding: 32px;
  position: relative;
}

/* Grid View */
.file-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 14px;
}

.grid-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 10px 8px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease, box-shadow 0.12s ease;
  position: relative;
  text-align: center;
}

.grid-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border);
  transform: translateY(-2px);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
}
.grid-card.selected {
  background: var(--accent-soft);
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
}

.grid-card .icon-wrapper {
  width: 48px; height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
  border-radius: var(--radius-sm);
  transition: transform 0.12s ease;
}
.grid-card:hover .icon-wrapper {
  transform: scale(1.06);
}

.grid-card .icon-wrapper.folder { color: #3b82f6; }
.grid-card .icon-wrapper.image { color: #f59e0b; }
.grid-card .icon-wrapper.video { color: #ef4444; }
.grid-card .icon-wrapper.audio { color: #10b981; }
.grid-card .icon-wrapper.document { color: #0ea5e9; }
.grid-card .icon-wrapper.code { color: #8b5cf6; }
.grid-card .icon-wrapper.archive { color: #eab308; }
.grid-card .icon-wrapper.file { color: var(--text-secondary); }

.grid-card .title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 8px;
}
.grid-card .meta {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 4px;
}

/* List View */
.file-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.list-header {
  display: grid;
  grid-template-columns: 2fr 1fr 1.2fr 60px;
  padding: 12px 20px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-tertiary);
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.list-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1.2fr 60px;
  align-items: center;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
  background: var(--bg-card);
  border: 1px solid transparent;
}

.list-row:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-subtle);
}
.list-row.selected {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.list-row .name-col {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
}
.list-row .name-text {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.list-row .size-col, .list-row .date-col {
  font-size: 13px;
  color: var(--text-secondary);
}

/* Empty View */
.empty-view {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 120px 20px;
  color: var(--text-tertiary);
  text-align: center;
  animation: popIn 0.5s ease;
}
.empty-view .svg-icon {
  margin-bottom: 16px;
  opacity: 0.5;
}
.empty-view h3 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.empty-view p { font-size: 14px; }

/* Drag Overlay */
.drop-zone-overlay {
  position: absolute;
  inset: 16px;
  border: 2px dashed var(--accent);
  background: rgba(139, 92, 246, 0.1);
  border-radius: var(--radius-lg);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
  backdrop-filter: blur(8px);
}
.drop-zone-overlay.active { display: flex; animation: fadeIn 0.3s; }
.drop-zone-overlay .box {
  background: var(--bg-sidebar);
  padding: 32px 48px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  text-align: center;
  box-shadow: var(--shadow-float);
  transform: scale(1.1);
  animation: pulseBox 2s infinite alternate;
}

@keyframes pulseBox {
  from { transform: scale(1); box-shadow: var(--shadow-float); }
  to { transform: scale(1.05); box-shadow: var(--shadow-glow); }
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* ============================================================================
   CONTEXT MENU (NOVA STYLE - HORIZONTAL PILL)
   ============================================================================ */
.nova-menu {
  position: fixed;
  z-index: 2000;
  background: rgba(14, 15, 22, 0.9);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  padding: 5px;
  box-shadow: var(--shadow-float), 0 0 20px rgba(139, 92, 246, 0.15);
  display: none;
  align-items: center;
  gap: 4px;
  transform-origin: center;
  animation: menuIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.nova-menu.show { display: flex; }

@keyframes menuIn {
  from { opacity: 0; transform: scale(0.8) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.nova-menu-item {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: 8px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--bounce);
  border: none;
  background: none;
  padding: 0;
}
.nova-menu-item:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
  transform: scale(1.15) translateY(-3px);
}
.nova-menu-item.danger:hover {
  background: rgba(239, 68, 68, 0.2);
  color: var(--system-red);
}
.nova-menu-item .svg-icon {
  width: 20px;
  height: 20px;
}
.nova-menu-sep {
  width: 1px;
  height: 22px;
  background: var(--border);
  margin: 0 6px;
}

/* ============================================================================
   MODAL
   ============================================================================ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 3000;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(16px);
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-backdrop.show { display: flex; }

.nova-modal {
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  width: 500px;
  max-width: 90vw;
  max-height: 85vh;
  overflow: hidden;
  box-shadow: var(--shadow-float);
  display: flex;
  flex-direction: column;
  animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-header {
  padding: 24px 32px 16px;
  border-bottom: 1px solid var(--border-subtle);
}
.modal-header h3 { font-size: 18px; font-weight: 800; }

.modal-body {
  padding: 24px 32px;
  overflow-y: auto;
  flex: 1;
}

.modal-footer {
  padding: 20px 32px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  background: rgba(0, 0, 0, 0.2);
}

.btn-secondary {
  padding: 12px 24px;
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--bounce);
}
.btn-secondary:hover { 
  background: var(--bg-card-hover); 
  transform: translateY(-2px);
}

.btn-primary-sm {
  padding: 12px 24px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius-full);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--bounce);
}
.btn-primary-sm:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}
.btn-danger-sm {
  background: var(--system-red);
}
.btn-danger-sm:hover {
  background: #f87171;
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
}

/* Editor */
.code-editor {
  width: 100%;
  min-height: 320px;
  background: #040405;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  color: #e2e8f0;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  resize: vertical;
  outline: none;
  transition: border 0.3s;
}
.code-editor:focus {
  border-color: var(--accent);
}

/* Toasts */
.toast-rack {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 4000;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.nova-toast {
  padding: 14px 24px;
  background: rgba(20, 21, 28, 0.95);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  backdrop-filter: blur(20px);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-float);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: toastSlide 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes toastSlide {
  from { transform: translateX(100%) scale(0.9); opacity: 0; }
  to { transform: translateX(0) scale(1); opacity: 1; }
}

/* ============================================================================
   RESPONSIVE DESIGN — 3 BREAKPOINTS (Mobile / Tablet / Small Desktop)
   ============================================================================ */

/* ── Mobile (até 480px) ────────────────────────────────────────────────── */
@media (max-width: 480px) {
  body { overflow: auto; }
  
  /* App container: stack vertically */
  .app-container { flex-direction: column; height: auto; min-height: 100vh; }
  
  /* Sidebar becomes bottom floating bar */
  .sidebar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    width: 100%; min-width: 0;
    height: auto;
    flex-direction: row;
    padding: 8px 12px env(safe-area-inset-bottom, 12px);
    border-right: none;
    border-top: 1px solid var(--border);
    border-radius: var(--radius-md) var(--radius-md) 0 0;
    background: rgba(14, 15, 22, 0.9);
    backdrop-filter: var(--blur);
    gap: 0;
    justify-content: space-around;
    overflow-x: auto;
  }
  .sidebar .brand-title,
  .sidebar .nav-section-title,
  .sidebar .storage-widget,
  .sidebar .sidebar-spacer { display: none; }
  
  .sidebar .nav-group { flex-direction: row; gap: 0; }
  .sidebar .nav-btn { 
    flex-direction: column; 
    gap: 4px; 
    padding: 6px 10px; 
    font-size: 10px; 
    border-radius: var(--radius-sm);
    min-width: 56px;
    text-align: center;
    justify-content: center;
  }
  .sidebar .nav-btn:hover { transform: none; }
  .sidebar .nav-btn .svg-icon { width: 20px; height: 20px; }
  
  /* Content area: add bottom padding for floating bar */
  .content-area { padding-bottom: 80px; }
  
  /* Toolbar: compact */
  .toolbar {
    height: 52px;
    padding: 0 10px;
    gap: 8px;
    flex-wrap: nowrap;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .toolbar-left { gap: 8px; }
  .btn-icon-soft { width: 34px; height: 34px; }
  
  /* Breadcrumb: compact pills */
  .breadcrumb-trail { padding: 3px; }
  .breadcrumb-item { padding: 4px 8px; font-size: 11px; gap: 3px; }
  .breadcrumb-item .svg-icon { width: 14px; height: 14px; }
  
  /* Search: full-width below toolbar or hidden initially */
  .search-bar { width: 100px; padding: 5px 8px; }
  .search-bar:focus-within { width: 140px; }
  
  /* Segmented control (view mode): hide on very small screens */
  .segmented-control { display: none; }
  
  /* Upload button: smaller */
  .btn-primary-sm { padding: 6px 10px; font-size: 12px; }
  
  /* File grid: 2 columns with smaller cards */
  .file-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .grid-card { padding: 14px 6px 10px; border-radius: var(--radius-sm); }
  .grid-card .icon-wrapper { width: 44px; height: 44px; }
  .grid-card .title { font-size: 11px; }
  .grid-card .meta { font-size: 10px; }
  .grid-card:hover { transform: none; }
  
  /* List view: compact */
  .viewport { padding: 12px; }
  .list-header { grid-template-columns: 2fr 1fr 40px; font-size: 10px; padding: 6px 10px; }
  .list-row { grid-template-columns: 2fr 1fr 40px; padding: 8px 10px; }
  .list-row .date-col { display: none; }
  .list-header .col-date { display: none; }
  
  /* Modals: full screen */
  .modal-backdrop { align-items: flex-end; }
  .nova-modal {
    width: 100%;
    max-width: 100vw;
    border-radius: var(--radius-md) var(--radius-md) 0 0;
    max-height: 90vh;
  }
  .modal-header { padding: 16px 20px; }
  .modal-body { padding: 16px 20px; }
  .modal-footer { padding: 12px 20px; }
  
  /* Login card: full width */
  .login-card { width: 100%; max-width: 90vw; border-radius: var(--radius-md); padding: 32px 24px; }
  .login-brand { width: 56px; height: 56px; }
  .login-card h1 { font-size: 22px; }
  
  /* Toasts: center bottom */
  .toast-rack { bottom: 100px; right: 16px; left: 16px; }
  
  /* Context menu: horizontal pill centered near touch */
  .nova-menu { gap: 2px; padding: 4px; }
  .nova-menu-item { width: 38px; height: 38px; }
  .nova-menu-item .svg-icon { width: 18px; height: 18px; }
  
  /* Empty view: smaller */
  .empty-view { padding: 40px 16px; }
  .empty-view h3 { font-size: 15px; }
  .empty-view p { font-size: 12px; }
  
  /* Drag overlay: adjusted margins */
  .drop-zone-overlay { inset: 6px; }
}

/* ── Tablet (481px - 768px) ────────────────────────────────────────────── */
@media (min-width: 481px) and (max-width: 768px) {
  /* Sidebar: collapsible overlay (we keep it hidden by default, but with a toggle button) */
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    z-index: 200;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    width: 280px;
    border-right: 1px solid var(--border);
    background: var(--bg-sidebar);
    backdrop-filter: var(--blur);
  }
  .sidebar.open { transform: translateX(0); }
  
  /* Sidebar overlay backdrop */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 199;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
  }
  .sidebar-overlay.active { display: block; }
  
  /* Mobile menu toggle button */
  .menu-toggle-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px; height: 36px;
    border-radius: var(--radius-xs);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    cursor: pointer;
    transition: var(--bounce);
  }
  .menu-toggle-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
  
  /* Toolbar */
  .toolbar { height: 56px; padding: 0 14px; gap: 10px; }
  .search-bar { width: 150px; }
  .search-bar:focus-within { width: 200px; }
  .breadcrumb-item { padding: 4px 10px; font-size: 12px; }
  
  /* File grid: 3 columns */
  .file-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .viewport { padding: 20px; }
  
  /* Modals: slightly smaller */
  .nova-modal { width: 85vw; }
}

/* ── Tablet landscape / Small Desktop (769px - 1024px) ─────────────────── */
@media (min-width: 769px) and (max-width: 1024px) {
  .sidebar { width: 230px; min-width: 230px; }
  .sidebar .brand-title { font-size: 18px; }
  .nav-btn { padding: 10px 12px; font-size: 13px; }
  
  .toolbar { padding: 0 18px; }
  .file-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .viewport { padding: 24px; }
  
  /* Hide menu toggle button on desktop */
  .menu-toggle-btn { display: none; }
}

/* ── Large Desktop (>1024px) ──────────────────────────────────────────── */
@media (min-width: 1025px) {
  .sidebar { width: 280px; min-width: 280px; }
  .menu-toggle-btn { display: none; }
  .sidebar-overlay { display: none; }
}
</style>

<body>

<div id="p5-canvas-container" style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.45;mix-blend-mode:screen"></div>

<!-- LOGIN -->
<div class="login-wrapper" id="loginScreen">
  <div class="login-card">
    <div class="login-brand">
      <svg class="svg-icon xl" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <h1>NovaDrive</h1>
    <p>Modern File Manager</p>

        <label>Password</label>
        <input type="password" id="loginPass" value="admin" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Entrar no Drive</button>
      <div class="login-err" id="loginErr"></div>

</div>

<!-- APP -->
<div class="app-container">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- SIDEBAR -->

    <div class="brand-title" style="cursor: pointer; justify-content: flex-start; width: 100%; transition: var(--bounce);" onclick="toggleDesktopSidebar()" title="Expandir/Recolher Menu">
      <svg class="svg-icon lg" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      <span>NovaDrive</span>
    </div>

    
    
    <div>
      
      
      <div class="nav-group">
        <button class="nav-btn active" onclick="navigateTo('/workspace')" title="Workspace">
          <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          <span style="flex:1">Workspace</span>
        </button>
        <button class="nav-btn" onclick="navigateTo('/')" title="Root (Sistema)">

<script>


// ============================================================================
// KEYBOARD SHORTCUTS
// ============================================================================
document.addEventListener('keydown', (e) => {
  const isModalOpen = document.getElementById('modalBackdrop').classList.contains('show');
  
  if (isModalOpen) {
    if (state.galleryImages && state.galleryImages.length > 0) {
      if (e.key === 'ArrowRight') nextGalleryImage();
      if (e.key === 'ArrowLeft') prevGalleryImage();
    }
    if (e.key === 'Escape') closeModal();
    return;
  }
  
  // Intercept Ctrl+F or / anywhere to focus search
  if (((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) || (e.key === '/' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA')) {
    e.preventDefault();
    const input = document.getElementById('searchInput');
    if (input) {
      input.focus();
      input.select();
    }
    return;
  }

  // Don't intercept other keys if typing in inputs
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    if (e.key === 'Escape' && e.target.id === 'searchInput') {
      clearSearch();
    }
    return;
  }

  if (e.key === 'Escape' && state.isSearching) {
    clearSearch();
    return;
  }

  if (e.key === 'Delete' && state.selected.size > 0) {
    const paths = Array.from(state.selected);
    confirmDelete(paths[0]); // Apaga o primeiro selecionado
  }
  if (e.key === 'F2' && state.selected.size === 1) {
    promptRename(Array.from(state.selected)[0]);
  }
  if (e.key === 'a' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    state.selected.clear();
    state.items.forEach(i => state.selected.add(i.path));
    renderViewport({ items: state.items });
  }
});

// ============================================================================
// STATE & API
// ============================================================================
const state = {
  token: null,
  user: null,
  currentPath: '/',
  items: [],
  selected: new Set(),
  viewMode: 'grid',
  searchQuery: '',
  searchRecursive: true,
  searchFilter: 'all',
  isSearching: false,
  calcFolderSizes: false,
  sortBy: 'name',
  sortAsc: true,
  activeItem: null,
  galleryImages: [],
  currentGalleryIndex: 0,
};

const API = window.location.origin + '/api';


async function fetchApi(method, path, body = null) {
  const opts = {
    method,
    headers: { 'Authorization': `Bearer ${state.token}` }
  };
  if (state.secureCode) {
    opts.headers['X-Secure-Code'] = state.secureCode;
  }
  if (body instanceof FormData) {
    opts.body = body;
  } else if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let res = await fetch(API + path, opts);
  if (res.status === 403) {
    const err = await res.clone().json().catch(() => ({}));
    if (err.detail && err.detail.includes('Código de segurança')) {
      const code = await promptSecureCode();
      if (!code) throw new Error('Ação cancelada: Código de segurança necessário');
      state.secureCode = code;
      opts.headers['X-Secure-Code'] = code;
      res = await fetch(API + path, opts);
    }
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || 'Erro na requisição');
  }
  return res.json().catch(() => ({}));
}

function promptSecureCode() {
  return new Promise(resolve => {
    showModal(`
      <div class="modal-header">
        <h3>🔐 Proteção de Sistema</h3>
      </div>
      <div class="modal-body">
        <p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px;line-height:1.5">Você está modificando um diretório de sistema crítico. Insira o código seguro (Padrão: 123456):</p>
        <input type="password" id="secCode" style="width:100%;padding:14px 16px;border-radius:var(--radius-full);border:1px solid var(--border);background:var(--bg-card);color:white;outline:none" placeholder="Código Seguro">
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="resolveSecureCode(null)">Cancelar</button>
        <button class="btn-primary-sm" onclick="resolveSecureCode(document.getElementById('secCode').value)">Verificar</button>
      </div>
    `);
    setTimeout(() => document.getElementById('secCode').focus(), 100);
    window.currentSecureResolve = resolve;
  });
}

function resolveSecureCode(val) {
  closeModal();
  if (window.currentSecureResolve) {
    window.currentSecureResolve(val);
    window.currentSecureResolve = null;
  }
}


// ============================================================================
// AUTH
// ============================================================================
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginErr');
  btn.disabled = true;
  btn.textContent = 'Verificando...';
  err.classList.remove('show');

  try {
    const payload = {
      username: document.getElementById('loginUser').value.trim(),
      password: document.getElementById('loginPass').value
    };
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({ detail: 'Credenciais inválidas' }));
      throw new Error(data.detail || 'Falha no login');
    }
    const data = await res.json();
    state.token = data.token;
    state.user = data.user;

    document.getElementById('loginScreen').classList.add('hidden');
    loadFiles('/workspace');
    loadStorage();
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.add('show');
    // Trigger shake animation manually if needed
    err.style.animation = 'none';
    setTimeout(() => err.style.animation = '', 10);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar no Drive';
  }
};

// ============================================================================
// FILE RENDERING
// ============================================================================

async function loadFiles(path) {
  // Evitar duplas barras no final ex: /workspace/
  if (path.length > 1 && path.endsWith('/')) {
    path = path.slice(0, -1);
  }
  
  state.currentPath = path;
  state.selected.clear();
  state.isSearching = false;
  
  // Atualiza sidebar ativa
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.remove('active');
    const action = btn.getAttribute('onclick');
    // Para destacar workspace só quando estiver EXATAMENTE no root do workspace
    if (action && action.includes(`navigateTo('${path}')`)) {
      btn.classList.add('active');
    }
  });

  const container = document.getElementById('fileContainer');
  const hasExistingContent = container.querySelector('.file-grid, .file-list');
  if (!hasExistingContent) {
    container.innerHTML = '<div class="empty-view"><p style="color:var(--text-tertiary)">Carregando...</p></div>';
  } else {
    container.style.opacity = '0.6';
    container.style.pointerEvents = 'none';
  }

  try {
    const params = new URLSearchParams({ path });
    if (state.calcFolderSizes) params.set('calc_folder_sizes', 'true');
    const data = await fetchApi('GET', '/files?' + params);
    state.items = data.items || [];
    applySortAndRender();
    renderBreadcrumbs(data.breadcrumbs);
  } catch (e) {
    container.innerHTML = `<div class="empty-view"><h3 style="color:var(--system-red)">Erro</h3><p>${e.message}</p></div>`;
  } finally {
    container.style.opacity = '1';
    container.style.pointerEvents = '';
  }
}

function sortItems(by) {
  if (state.sortBy === by) {
    state.sortAsc = !state.sortAsc;
  } else {
    state.sortBy = by;
    state.sortAsc = (by === 'name');
    if (by === 'size') state.sortAsc = false;
  }
  applySortAndRender();
}

function applySortAndRender() {
  if (!state.items) return;
  state.items.sort((a, b) => {
    if (state.sortBy === 'size') {
      const sizeA = a.size || 0;
      const sizeB = b.size || 0;
      return state.sortAsc ? sizeA - sizeB : sizeB - sizeA;
    }
    if (state.sortBy === 'modified') {
      const dateA = a.modified || '';
      const dateB = b.modified || '';
      return state.sortAsc ? dateA.localeCompare(dateB) : dateB.localeCompare(dateA);
    }
    if (a.is_dir !== b.is_dir && !state.isSearching) {
      return a.is_dir ? -1 : 1;
    }
    const nameA = a.name.toLowerCase();
    const nameB = b.name.toLowerCase();
    return state.sortAsc ? nameA.localeCompare(nameB) : nameB.localeCompare(nameA);
  });
  renderViewport({ items: state.items, isSearch: state.isSearching });
}

function renderViewport(data) {
  const container = document.getElementById('fileContainer');
  const items = data.items || [];
  const isSearch = data.isSearch || state.isSearching;

  let searchBannerHtml = '';
  if (isSearch) {
    searchBannerHtml = `
      <div class="search-banner">
        <div class="search-banner-info">
          <svg class="svg-icon" style="color:var(--accent)" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span>Resultados para <strong>"${escapeHtml(state.searchQuery)}"</strong> ${state.searchRecursive ? 'em subpastas' : 'nesta pasta'} — <strong>${items.length} ${items.length === 1 ? 'item encontrado' : 'itens encontrados'}</strong></span>
        </div>
        <div class="search-banner-actions">
          <button class="filter-chip ${state.searchFilter === 'all' ? 'active' : ''}" onclick="setSearchFilter('all')">Todos</button>
          <button class="filter-chip ${state.searchFilter === 'folder' ? 'active' : ''}" onclick="setSearchFilter('folder')">📁 Pastas</button>
          <button class="filter-chip ${state.searchFilter === 'document' ? 'active' : ''}" onclick="setSearchFilter('document')">📄 Documentos</button>
          <button class="filter-chip ${state.searchFilter === 'image' ? 'active' : ''}" onclick="setSearchFilter('image')">🖼️ Imagens</button>
          <button class="filter-chip ${state.searchFilter === 'video' ? 'active' : ''}" onclick="setSearchFilter('video')">🎬 Vídeos</button>
          <button class="filter-chip ${state.searchFilter === 'code' ? 'active' : ''}" onclick="setSearchFilter('code')">💻 Código</button>
          <button class="filter-chip ${state.searchFilter === 'archive' ? 'active' : ''}" onclick="setSearchFilter('archive')">📦 Zips</button>
          <button class="btn-clear-search" onclick="clearSearch()">Limpar Busca ✕</button>
        </div>
      </div>
    `;
  }

  if (items.length === 0) {
    if (isSearch) {
      container.innerHTML = searchBannerHtml + `
        <div class="empty-view">
          <svg class="svg-icon xl" viewBox="0 0 24 24" style="color:var(--text-tertiary)"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <h3>Nenhum arquivo ou pasta encontrado</h3>
          <p>Nenhum item corresponde a "${escapeHtml(state.searchQuery)}". Tente outro termo ou ative a busca recursiva.</p>
        </div>
      `;
    } else {
      container.innerHTML = `
        <div class="empty-view">
          <svg class="svg-icon xl" viewBox="0 0 24 24" style="color:var(--accent)"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <h3>Tudo limpo por aqui</h3>
          <p>Arraste arquivos ou clique no botão de upload.</p>
        </div>
      `;
    }
    return;
  }

  if (state.viewMode === 'grid') {
    container.innerHTML = searchBannerHtml + `<div class="file-grid">${items.map(item => `
      <div class="grid-card ${state.selected.has(item.path) ? 'selected' : ''}"
           data-path="${escapeHtml(item.path)}"
           onclick="handleItemClick('${escapeHtml(item.path)}', ${item.is_dir ? 'true' : 'false'}, event)"
           ondblclick="${item.is_dir ? `navigateTo('${escapeHtml(item.path)}')` : `openPreview('${escapeHtml(item.path)}')`}"
           oncontextmenu="openContextMenu(event, '${escapeHtml(item.path)}')">
        <div class="icon-wrapper ${item.icon}">
          ${getIconSvg(item)}
        </div>
        <div class="title" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
        ${(isSearch && item.directory) ? `<div class="search-dir-badge" title="${escapeHtml(item.directory)}">📁 ${escapeHtml(item.directory)}</div>` : ''}

              </div>

    `;
  }
}



function renderBreadcrumbs(crumbs) {
  const trail = document.getElementById('breadcrumbTrail');
  const inWorkspace = state.currentPath.startsWith('/workspace');
  const isRoot = state.currentPath === '/';
  
  let rootHtml = '';
  if (inWorkspace) {
    rootHtml = `
      <div class="breadcrumb-item ${state.currentPath === '/workspace' ? 'active' : ''}" onclick="navigateTo('/workspace')">
        <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        Workspace
      </div>
    `;
  } else {
    rootHtml = `
      <div class="breadcrumb-item ${isRoot ? 'active' : ''}" onclick="navigateTo('/')">
        <svg class="svg-icon" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
        Root
      </div>
    `;
  }
  
  trail.innerHTML = rootHtml;
  
  if (crumbs) {
    crumbs.forEach((c, idx) => {
      // Se for root ('/') vem vazio, ignora
      if (!c.name) return;
      // Se estamos dentro de workspace, pula o crumb "workspace"
      if (inWorkspace && c.name.toLowerCase() === 'workspace') return;
      
      // Verifica qual parte está ativa
      const pathToCheck = c.path === '/' ? c.path : (c.path.endsWith('/') ? c.path.slice(0, -1) : c.path);
      const isActive = pathToCheck === state.currentPath;
      
      trail.innerHTML += `
        <span class="breadcrumb-sep">/</span>
        <div class="breadcrumb-item ${isActive ? 'active' : ''}" onclick="navigateTo('${c.path}')">${c.name}</div>
      `;
    });
  }
}

function navigateTo(path) {
  state.searchQuery = '';
  state.isSearching = false;
  const input = document.getElementById('searchInput');
  if (input) input.value = '';
  const clearBtn = document.getElementById('searchClearBtn');
  if (clearBtn) clearBtn.style.display = 'none';
  loadFiles(path);
}

function goBack() {
  const parts = state.currentPath.replace(/\/$/, '').split('/');
  parts.pop();
  navigateTo(parts.join('/') || '/');
}

  const ext = item.extension || '';
  if (item.icon === 'image') return `<svg class="svg-icon lg" style="color:#f59e0b" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`;
  if (item.icon === 'video') return `<svg class="svg-icon lg" style="color:#ef4444" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`;
  if (item.icon === 'audio') return `<svg class="svg-icon lg" style="color:#10b981" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>`;

  if (item.icon === 'archive' || ['.zip','.rar','.7z','.tar','.gz'].includes(ext)) return `<svg class="svg-icon lg" style="color:#eab308" viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>`;
  if (item.icon === 'pdf' || ext === '.pdf') return `<svg class="svg-icon lg" style="color:#ef4444" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M16 13H8"></path><path d="M16 17H8"></path><path d="M10 9H8"></path></svg>`;
  
  if (['.doc','.docx','.odt'].includes(ext)) return `<svg class="svg-icon lg" style="color:#3b82f6" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M9 15l2-3 2 3"></path></svg>`;
  if (['.xls','.xlsx','.csv'].includes(ext)) return `<svg class="svg-icon lg" style="color:#10b981" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M8 13h8"></path><path d="M8 17h8"></path><path d="M12 13v4"></path></svg>`;
  if (['.ppt','.pptx'].includes(ext)) return `<svg class="svg-icon lg" style="color:#f97316" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><rect x="8" y="10" width="8" height="6"></rect></svg>`;
  
  return `<svg class="svg-icon lg" style="color:var(--text-secondary)" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`;
}


function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function updateSelectionUi() {
  document.querySelectorAll('.grid-card, .list-row').forEach(el => {
    const p = el.getAttribute('data-path');
    if (p) {
      el.classList.toggle('selected', state.selected.has(p));
    }
  });
}

function handleItemClick(path, isDir, evt) {
  // Se estiver com tecla modificadora (Ctrl ou Cmd), alterna seleção
  if (evt && (evt.ctrlKey || evt.metaKey)) {
    if (state.selected.has(path)) {
      state.selected.delete(path);
    } else {
      state.selected.add(path);
    }
    updateSelectionUi();
    return;
  }

  // CLIQUE ÚNICO EM PASTA: ENTRA IMEDIATAMENTE NO DIRETÓRIO (sem delay nem animação)
  if (isDir) {
    state.selected.clear();
    navigateTo(path);
    return;
  }

  // CLIQUE ÚNICO EM ARQUIVO: seleciona o arquivo instantaneamente
  state.selected.clear();
  state.selected.add(path);
  updateSelectionUi();
}

function selectItem(path, evt) {
  if (evt && (evt.ctrlKey || evt.metaKey)) {
    if (state.selected.has(path)) state.selected.delete(path);
    else state.selected.add(path);
  } else {
    state.selected.clear();
    state.selected.add(path);
  }
  updateSelectionUi();
}

function setView(mode) {
  state.viewMode = mode;
  document.getElementById('btnGrid').classList.toggle('active', mode === 'grid');
  document.getElementById('btnList').classList.toggle('active', mode === 'list');
  renderViewport({ items: state.items });
}

let searchTimer;
function handleSearch(val) {
  clearTimeout(searchTimer);
  const q = val.trim();
  const clearBtn = document.getElementById('searchClearBtn');
  if (clearBtn) clearBtn.style.display = q ? 'flex' : 'none';

  if (!q) {
    if (state.isSearching) {
      clearSearch();
    }
    return;
  }

  searchTimer = setTimeout(() => {
    executeSearch(q);
  }, 280);
}

function toggleSearchScope(evt) {
  if (evt) evt.stopPropagation();
  state.searchRecursive = !state.searchRecursive;
  const scopeText = document.getElementById('searchScopeText');
  const scopeBtn = document.getElementById('searchScopeBtn');
  if (scopeText) scopeText.textContent = state.searchRecursive ? 'Recursivo' : 'Nesta pasta';
  if (scopeBtn) scopeBtn.classList.toggle('active', state.searchRecursive);
  
  const searchInput = document.getElementById('searchInput');
  if (searchInput && searchInput.value.trim()) {
    executeSearch(searchInput.value.trim());
  }
}

async function executeSearch(query) {
  state.searchQuery = query;
  state.isSearching = true;
  state.selected.clear();

  const container = document.getElementById('fileContainer');
  container.innerHTML = '<div class="empty-view"><p>Pesquisando arquivos...</p></div>';

  try {
    const params = new URLSearchParams({
      query: query,
      path: state.currentPath,
      recursive: state.searchRecursive ? 'true' : 'false'
    });
    if (state.searchFilter && state.searchFilter !== 'all') {
      params.set('file_type', state.searchFilter);
    }
    const data = await fetchApi('GET', '/files/search?' + params);
    state.items = data.items || [];
    applySortAndRender();
  } catch (e) {
    container.innerHTML = `<div class="empty-view"><h3 style="color:var(--system-red)">Erro na pesquisa</h3><p>${e.message}</p></div>`;
  }
}

function setSearchFilter(type) {
  state.searchFilter = type;
  if (state.searchQuery) {
    executeSearch(state.searchQuery);
  }
}

function clearSearch() {
  state.searchQuery = '';
  state.isSearching = false;
  state.searchFilter = 'all';
  const input = document.getElementById('searchInput');
  if (input) input.value = '';
  const clearBtn = document.getElementById('searchClearBtn');
  if (clearBtn) clearBtn.style.display = 'none';
  loadFiles(state.currentPath);
}

async function toggleFolderSizes() {
  state.calcFolderSizes = !state.calcFolderSizes;
  const btn = document.getElementById('btnFolderSizes');
  if (btn) btn.classList.toggle('active', state.calcFolderSizes);
  toast(state.calcFolderSizes ? 'Calculando tamanhos das pastas...' : 'Tamanhos de pastas ocultados');
  loadFiles(state.currentPath);
}


function openContextMenu(e, path) {
  e.preventDefault();
  e.stopPropagation(); // Stop global contextmenu listener from firing
  
  state.activeItem = path;
  if (!state.selected.has(path)) {
    state.selected.clear();
    state.selected.add(path);
    updateSelectionUi();
  }
  
  const menu = document.getElementById('novaMenu');
  
  // Extrair só pra ZIP
  const extractBtn = document.getElementById('menuExtract');
  if (path.toLowerCase().endsWith('.zip')) {
    extractBtn.style.display = 'flex';
  } else {
    extractBtn.style.display = 'none';
  }

  // Mostrar na pasta (durante busca)
  const showInFolderBtn = document.getElementById('menuShowInFolder');
  const clickedItem = state.items.find(i => i.path === path);
  if (showInFolderBtn) {
    if (state.isSearching && clickedItem && clickedItem.directory) {
      showInFolderBtn.style.display = 'flex';
    } else {
      showInFolderBtn.style.display = 'none';
    }
  }
  
  // Calculate position to prevent menu going off-screen
  let x = e.clientX;
  let y = e.clientY;
  
  menu.style.display = 'flex';
  menu.style.opacity = '0';
  
  requestAnimationFrame(() => {
    const rect = menu.getBoundingClientRect();
    const winWidth = window.innerWidth;
    const winHeight = window.innerHeight;
    
    if (x + rect.width > winWidth) x = winWidth - rect.width - 10;
    if (y + rect.height > winHeight) y = winHeight - rect.height - 10;
    
    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
    
    menu.style.display = '';
    menu.style.opacity = '';
    menu.classList.add('show');
  });
}



// ============================================================================
// GLOBAL CONTEXT MENU & CLICK HANDLING
// ============================================================================
document.addEventListener('contextmenu', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    return;
  }
  
  e.preventDefault();
  
  if (!e.target.closest('.grid-card') && !e.target.closest('.list-row')) {
    // Click no espaço vazio: esconde o menu de arquivo
    const menu = document.getElementById('novaMenu');
    if(menu) menu.classList.remove('show');
    
    if (state.selected.size > 0) {
      state.selected.clear();
      renderViewport({ items: state.items });
    }
    
    // Abre o menu do fundo vazio
    const menuEmpty = document.getElementById('novaMenuEmpty');
    if (menuEmpty) {
      let x = e.clientX;
      let y = e.clientY;
      menuEmpty.style.display = 'flex';
      menuEmpty.style.opacity = '0';
      
      requestAnimationFrame(() => {
        const rect = menuEmpty.getBoundingClientRect();
        if (x + rect.width > window.innerWidth) x = window.innerWidth - rect.width - 10;
        if (y + rect.height > window.innerHeight) y = window.innerHeight - rect.height - 10;
        menuEmpty.style.left = x + 'px';
        menuEmpty.style.top = y + 'px';
        menuEmpty.style.display = '';
        menuEmpty.style.opacity = '';
        menuEmpty.classList.add('show');
      });
    }
  } else {
    // Se clicar no arquivo, esconde o menu do fundo
    const menuEmpty = document.getElementById('novaMenuEmpty');
    if(menuEmpty) menuEmpty.classList.remove('show');
  }
});

document.addEventListener('click', () => {
  const m1 = document.getElementById('novaMenu');
  const m2 = document.getElementById('novaMenuEmpty');
  if(m1) m1.classList.remove('show');
  if(m2) m2.classList.remove('show');
});


function triggerAction(action) {
  const path = state.activeItem;
  if (!path) return;
  if (action === 'download') {
    window.open(`${API}/files/download?path=${encodeURIComponent(path)}&token=${state.token}`, '_blank');
  } else if (action === 'preview') {
    openPreview(path);
  } else if (action === 'rename') {
    promptRename(path);
  } else if (action === 'delete') {
    confirmDelete(path);
  } else if (action === 'share') {
    createShareLink(path);
  } else if (action === 'extract') {
    extractZip(path);
  } else if (action === 'show-in-folder') {
    const item = state.items.find(i => i.path === path);
    if (item && item.directory) {
      state.isSearching = false;
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = '';
      const clearBtn = document.getElementById('searchClearBtn');
      if (clearBtn) clearBtn.style.display = 'none';
      
      loadFiles(item.directory).then(() => {
        state.selected.clear();
        state.selected.add(item.path);
        renderViewport({ items: state.items });
      });
    }
  }
}

async function createShareLink(path) {
  try {
    const form = new FormData();
    form.append('path', path);
    form.append('expires_in_hours', '168'); // 7 days
    
    toast('Gerando link...', 'info');
    const data = await fetchApi('POST', '/files/share', form);
    
    const fullUrl = window.location.origin + data.url;
    
    showModal(`
      <div class="modal-header">
        <h3>🔗 Link Público Gerado</h3>
      </div>
      <div class="modal-body" style="text-align:center">
        <p style="color:var(--text-secondary);font-size:14px;margin-bottom:20px">Qualquer pessoa com este link pode baixar o arquivo. Ele expira em 7 dias.</p>
        <div style="display:flex;gap:8px">
          <input type="text" id="shareUrl" value="${fullUrl}" readonly style="flex:1;padding:12px;background:var(--bg-app);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--accent);font-family:monospace;font-size:13px;outline:none">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Fechar</button>
        <button class="btn-primary-sm" onclick="copyToClipboard('${fullUrl}')">Copiar Link</button>
      </div>
    `);
  } catch(e) {
    toast(e.message, 'error');
  }
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    toast('Link copiado!');
  }).catch(err => {
    console.error('Copy failed', err);
  });
}

async function extractZip(path) {
  toast('Extraindo ZIP...', 'info');
  try {
    const form = new FormData();
    form.append('path', path);
    await fetchApi('POST', '/files/extract', form);
    toast('Extração concluída com sucesso!');
    loadFiles(state.currentPath);
  } catch(e) {
    toast(e.message, 'error');
  }
}

async function doUpload(files, isFolder = false) {
  const status = document.getElementById('uploadStatus');
  
  if (files.length === 0) return;
  
  status.innerHTML = '<span style="color:var(--accent)">Processando upload...</span>';
  
  try {
    // If it's a folder, we need to upload files while preserving paths
    // Since FormData doesn't natively send the relative path, we reconstruct it
    // Actually, sending them one by one or in batches is better for huge folders, but let's keep it simple for now
    // We will append the relative path to a separate form field to let backend know, but since backend doesn't support relative path creation natively yet, we fallback to flat if not supported.
    // BUT! HTML5 FormData now supports `webkitRelativePath` if we just append the File object!
    // For this version we will just send all files. Note: Backend currently writes to upload_dir / file.filename (which is just the basename).
    // So true folder structure requires backend change. For now we will allow it but they land flat.
    
    const form = new FormData();
    form.append('path', state.currentPath);
    for (const f of files) {
      form.append('files', f);
      // Send the relative path (webkitRelativePath) to recreate folders!
      form.append('paths', f.webkitRelativePath || f.name);
    }

    const data = await fetchApi('POST', '/files/upload', form);
    status.innerHTML = `<span style="color:var(--system-green)">✅ Upload de ${data.uploaded} item(ns) concluído.</span>`;
    setTimeout(() => { closeModal(); loadFiles(state.currentPath); }, 1200);
  } catch (e) {
    status.innerHTML = `<span style="color:var(--system-red)">❌ ${e.message}</span>`;
  }
}


function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropOverlay').classList.remove('active');

}

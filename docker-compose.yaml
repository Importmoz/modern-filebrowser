# =============================================================================
# docker-compose.yml — NovaDrive (Modern File Browser)
# =============================================================================

services:
  novadrive:
    build: .
    container_name: novadrive
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8090"
    volumes:
      - "${ROOT_PATH:-/mnt/storage}:/data:rw"
      - ./data:/app/data
    environment:
      - ROOT_PATH=/data
      - USERS_FILE=/app/data/users.json
      - PORT=8090
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-524288000}
      - TZ=${TZ:-America/Sao_Paulo}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - novadrive-net

networks:
  novadrive-net:
    driver: bridge

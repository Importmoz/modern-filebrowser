<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaDrive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   NOVA DESIGN SYSTEM - FLUID, CURVED, ANIMATED
   ============================================================================ */
:root {
  --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* Color Palette - Deep Dark Glass */
  --bg-app: #08080b;
  --bg-sidebar: rgba(14, 15, 20, 0.65);
  --bg-main: rgba(10, 11, 15, 0.5);
  --bg-card: rgba(255, 255, 255, 0.025);
  --bg-card-hover: rgba(255, 255, 255, 0.06);
  --bg-card-active: rgba(255, 255, 255, 0.09);

  --border: rgba(255, 255, 255, 0.06);
  --border-subtle: rgba(255, 255, 255, 0.03);

  --text-primary: #ffffff;
  --text-secondary: #9ca3af;
  --text-tertiary: #6b7280;

  /* Brand Colors */
  --accent: #8b5cf6;
  --accent-hover: #a78bfa;
  --accent-glow: rgba(139, 92, 246, 0.3);
  --accent-soft: rgba(139, 92, 246, 0.1);
  
  --system-red: #ef4444;
  --system-green: #10b981;
  --system-blue: #3b82f6;

  /* Ultra Curved Radii */
  --radius-xs: 12px;
  --radius-sm: 18px;
  --radius-md: 24px;
  --radius-lg: 32px;
  --radius-xl: 40px;
  --radius-full: 999px;

  --shadow-float: 0 10px 30px -10px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.2);

  --blur: blur(40px) saturate(200%);
  --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  --bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }

body {
  font-family: var(--font-sans);
  background-color: var(--bg-app);
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
  user-select: none;
}

/* Background Atmosphere */
.bg-glow {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.bg-glow-1 {
  position: absolute;
  top: -20%; left: -10%;
  width: 60vw; height: 60vw;
  background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 60%);
  filter: blur(100px);
  animation: pulseGlow 15s ease-in-out infinite alternate;
}
.bg-glow-2 {
  position: absolute;
  bottom: -20%; right: -10%;
  width: 50vw; height: 50vw;
  background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
  filter: blur(100px);
  animation: pulseGlow 20s ease-in-out infinite alternate-reverse;
}

@keyframes pulseGlow {
  0% { transform: scale(0.9) translate(0, 0); opacity: 0.7; }
  100% { transform: scale(1.1) translate(5%, 5%); opacity: 1; }
}

/* ============================================================================
   SVG ICON SYSTEM
   ============================================================================ */
.svg-icon {
  width: 20px;
  height: 20px;
  stroke-width: 2;
  stroke: currentColor;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: inline-block;
  vertical-align: middle;
  transition: var(--bounce);
}
.svg-icon.lg { width: 26px; height: 26px; }
.svg-icon.xl { width: 48px; height: 48px; }

/* ============================================================================
   LOGIN SCREEN
   ============================================================================ */
.login-wrapper {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(8, 8, 11, 0.95);
  backdrop-filter: var(--blur);
  transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.login-wrapper.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(1.05);
}

.login-card {
  width: 400px;
  padding: 48px 40px;
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-float);
  text-align: center;
  position: relative;
  overflow: hidden;
  animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards;
}

@keyframes floatUp {
  0% { opacity: 0; transform: translateY(40px) scale(0.95); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.login-brand {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 72px; height: 72px;
  border-radius: var(--radius-md);
  background: var(--accent-soft);
  color: var(--accent);
  margin-bottom: 24px;
  border: 1px solid var(--accent-glow);
  box-shadow: var(--shadow-glow);
}
.login-brand svg { animation: floatIcon 3s ease-in-out infinite; }

@keyframes floatIcon {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.login-card h1 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 8px;
}
.login-card p {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 32px;
}

.field {
  margin-bottom: 20px;
  text-align: left;
}
.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 8px;
  padding-left: 4px;
}
.field input {
  width: 100%;
  padding: 16px 20px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 15px;
  outline: none;
  transition: var(--bounce);
}
.field input:focus {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.05);
  box-shadow: 0 0 0 4px var(--accent-soft);
  transform: scale(1.02);
}

.btn-primary {
  width: 100%;
  padding: 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-full);
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--bounce);
  margin-top: 12px;
}
.btn-primary:hover {
  background: var(--accent-hover);
  transform: translateY(-2px) scale(1.02);
  box-shadow: var(--shadow-glow);
}
.btn-primary:active { transform: translateY(1px) scale(0.98); }

.login-err {
  margin-top: 16px;
  padding: 12px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  border-radius: var(--radius-full);
  color: var(--system-red);
  font-size: 13px;
  display: none;
  animation: shake 0.4s ease-in-out;
}
.login-err.show { display: block; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* ============================================================================
   APP LAYOUT
   ============================================================================ */
.app-container {
  display: flex;
  height: 100vh;
  width: 100vw;
  position: relative;
  z-index: 1;
}

/* SIDEBAR */
.sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg-sidebar);
  backdrop-filter: var(--blur);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  gap: 24px;
}

.brand-title {
  font-size: 20px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px 12px;
  color: var(--text-primary);
}
.brand-title .svg-icon { color: var(--accent); }

.nav-section-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-tertiary);
  padding: 0 12px 8px;
}

.nav-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 600;
  background: transparent;
  border: none;
  cursor: pointer;
  transition: var(--bounce);
  width: 100%;
  text-align: left;
}
.nav-btn:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
  transform: translateX(4px);
}
.nav-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
}
.nav-btn:hover .svg-icon { transform: scale(1.15) rotate(-5deg); }

.sidebar-spacer { flex: 1; }

.storage-widget {
  padding: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  transition: var(--bounce);
}
.storage-widget:hover {
  background: var(--bg-card-hover);
  transform: translateY(-2px);
}
.storage-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  font-weight: 600;
}
.storage-track {
  height: 6px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.storage-fill {
  height: 100%;
  background: var(--accent);
  border-radius: var(--radius-full);
  transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

/* MAIN CONTENT AREA */
.content-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg-main);
  min-width: 0;
}

/* TOP TOOLBAR */
.toolbar {
  height: 72px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: rgba(10, 11, 15, 0.4);
  backdrop-filter: var(--blur);
  gap: 20px;
}

.toolbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 1;
  min-width: 0;
}

.btn-icon-soft {
  width: 40px; height: 40px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--bounce);
}
.btn-icon-soft:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
  transform: scale(1.05);
}

/* Curved Pill Breadcrumb */
.breadcrumb-trail {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--bg-card);
  padding: 6px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
}
.breadcrumb-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--bounce);
  white-space: nowrap;
}
.breadcrumb-item:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
}
.breadcrumb-item.active {
  background: var(--bg-card-active);
  color: var(--text-primary);
  font-weight: 700;
}
.breadcrumb-sep {
  color: var(--text-tertiary);
  font-size: 12px;
}

.toolbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Search Input */
.search-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  width: 220px;
  transition: var(--bounce);
}
.search-bar:focus-within {
  width: 280px;
  border-color: var(--accent);
  background: var(--bg-card-hover);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.search-bar input {
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 14px;
  width: 100%;
  font-family: var(--font-sans);
}
.search-bar input::placeholder { color: var(--text-tertiary); }
.search-bar .svg-icon { color: var(--text-secondary); }

/* View Mode Segmented Control */
.segmented-control {
  display: flex;
  padding: 4px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
}
.segmented-btn {
  padding: 6px 12px;
  border-radius: var(--radius-full);
  border: none;
  background: none;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--bounce);
  display: flex;
  align-items: center;
}
.segmented-btn.active {
  background: rgba(255, 255, 255, 0.1);
  color: var(--text-primary);
}

/* FILE VIEWPORT */
.viewport {
  flex: 1;
  overflow-y: auto;
  padding: 32px;
  position: relative;
}

/* Grid View */
.file-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 20px;
}

.grid-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--bounce);
  position: relative;
  text-align: center;
  animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.9) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.grid-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border);
  transform: translateY(-4px) scale(1.02);
  box-shadow: var(--shadow-float);
}
.grid-card.selected {
  background: var(--accent-soft);
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
}

.grid-card .icon-wrapper {
  width: 64px; height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  border-radius: var(--radius-sm);
  transition: var(--bounce);
}
.grid-card:hover .icon-wrapper {
  transform: scale(1.1);
}

.grid-card .icon-wrapper.folder { color: #3b82f6; }
.grid-card .icon-wrapper.image { color: #f59e0b; }
.grid-card .icon-wrapper.video { color: #ef4444; }
.grid-card .icon-wrapper.audio { color: #10b981; }
.grid-card .icon-wrapper.document { color: #0ea5e9; }
.grid-card .icon-wrapper.code { color: #8b5cf6; }
.grid-card .icon-wrapper.archive { color: #eab308; }
.grid-card .icon-wrapper.file { color: var(--text-secondary); }

.grid-card .title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 8px;
}
.grid-card .meta {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 4px;
}

/* List View */
.file-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.list-header {
  display: grid;
  grid-template-columns: 2fr 1fr 1.2fr 60px;
  padding: 12px 20px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-tertiary);
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.list-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1.2fr 60px;
  align-items: center;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--bounce);
  background: var(--bg-card);
  border: 1px solid transparent;
  animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) backwards;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}

.list-row:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-subtle);
  transform: translateX(4px);
}
.list-row.selected {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.list-row .name-col {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
}
.list-row .name-text {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.list-row .size-col, .list-row .date-col {
  font-size: 13px;
  color: var(--text-secondary);
}

/* Empty View */
.empty-view {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 120px 20px;
  color: var(--text-tertiary);
  text-align: center;
  animation: popIn 0.5s ease;
}
.empty-view .svg-icon {
  margin-bottom: 16px;
  opacity: 0.5;
}
.empty-view h3 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.empty-view p { font-size: 14px; }

/* Drag Overlay */
.drop-zone-overlay {
  position: absolute;
  inset: 16px;
  border: 2px dashed var(--accent);
  background: rgba(139, 92, 246, 0.1);
  border-radius: var(--radius-lg);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
  backdrop-filter: blur(8px);
}
.drop-zone-overlay.active { display: flex; animation: fadeIn 0.3s; }
.drop-zone-overlay .box {
  background: var(--bg-sidebar);
  padding: 32px 48px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  text-align: center;
  box-shadow: var(--shadow-float);
  transform: scale(1.1);
  animation: pulseBox 2s infinite alternate;
}

@keyframes pulseBox {
  from { transform: scale(1); box-shadow: var(--shadow-float); }
  to { transform: scale(1.05); box-shadow: var(--shadow-glow); }
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* ============================================================================
   CONTEXT MENU (NOVA STYLE)
   ============================================================================ */
.nova-menu {
  position: fixed;
  z-index: 2000;
  background: rgba(20, 21, 28, 0.95);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px;
  min-width: 200px;
  box-shadow: var(--shadow-float);
  display: none;
  transform-origin: top left;
  animation: menuIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.nova-menu.show { display: block; }

@keyframes menuIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.nova-menu-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-radius: var(--radius-xs);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  transition: var(--bounce);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.nova-menu-item:hover {
  background: var(--bg-card-hover);
  transform: translateX(4px);
  color: var(--text-primary);
}
.nova-menu-item.danger:hover {
  background: rgba(239, 68, 68, 0.15);
  color: var(--system-red);
}
.nova-menu-sep {
  height: 1px;
  background: var(--border);
  margin: 6px 8px;
}

/* ============================================================================
   MODAL
   ============================================================================ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 3000;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(16px);
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-backdrop.show { display: flex; }

.nova-modal {
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  width: 500px;
  max-width: 90vw;
  max-height: 85vh;
  overflow: hidden;
  box-shadow: var(--shadow-float);
  display: flex;
  flex-direction: column;
  animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-header {
  padding: 24px 32px 16px;
  border-bottom: 1px solid var(--border-subtle);
}
.modal-header h3 { font-size: 18px; font-weight: 800; }

.modal-body {
  padding: 24px 32px;
  overflow-y: auto;
  flex: 1;
}

.modal-footer {
  padding: 20px 32px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  background: rgba(0, 0, 0, 0.2);
}

.btn-secondary {
  padding: 12px 24px;
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--bounce);
}
.btn-secondary:hover { 
  background: var(--bg-card-hover); 
  transform: translateY(-2px);
}

.btn-primary-sm {
  padding: 12px 24px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius-full);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--bounce);
}
.btn-primary-sm:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}
.btn-danger-sm {
  background: var(--system-red);
}
.btn-danger-sm:hover {
  background: #f87171;
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
}

/* Editor */
.code-editor {
  width: 100%;
  min-height: 320px;
  background: #040405;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  color: #e2e8f0;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  resize: vertical;
  outline: none;
  transition: border 0.3s;
}
.code-editor:focus {
  border-color: var(--accent);
}

/* Toasts */
.toast-rack {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 4000;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.nova-toast {
  padding: 14px 24px;
  background: rgba(20, 21, 28, 0.95);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  backdrop-filter: blur(20px);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-float);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: toastSlide 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes toastSlide {
  from { transform: translateX(100%) scale(0.9); opacity: 0; }
  to { transform: translateX(0) scale(1); opacity: 1; }
}

@media (max-width: 768px) {
  .sidebar { display: none; }
  .toolbar { padding: 0 16px; height: 64px; }
  .search-bar { width: 140px; }
  .search-bar:focus-within { width: 180px; }
}
</style>
</head>
<body>

<div class="bg-glow">
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
</div>

<!-- LOGIN -->
<div class="login-wrapper" id="loginScreen">
  <div class="login-card">
    <div class="login-brand">
      <svg class="svg-icon xl" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <h1>NovaDrive</h1>
    <p>Modern File Manager</p>
    <form id="loginForm">
      <div class="field">
        <label>Username</label>
        <input type="text" id="loginUser" value="admin" required autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPass" value="admin" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Entrar no Drive</button>
      <div class="login-err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand-title">
      <svg class="svg-icon lg" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      NovaDrive
    </div>

    
    
    <div>
      <div class="nav-section-title">Locais</div>
      <div class="nav-group">
        <button class="nav-btn" onclick="navigateTo('/')">
          <svg class="svg-icon" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
          Root
        </button>
        <button class="nav-btn active" onclick="navigateTo('/workspace')">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          Workspace
        </button>
      </div>
    </div>



    <div>
      <div class="nav-section-title">Quick Actions</div>
      <div class="nav-group">
        <button class="nav-btn" onclick="promptFolder()">
          <svg class="svg-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Nova Pasta
        </button>
        <button class="nav-btn" onclick="openUploadModal()">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Fazer Upload
        </button>
      </div>
    </div>

    <div class="sidebar-spacer"></div>

    <div class="storage-widget">
      <div class="storage-info">
        <span>Storage</span>
        <span id="storageLabel">—</span>
      </div>
      <div class="storage-track">
        <div class="storage-fill" id="storageMeter" style="width: 0%"></div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="content-area">
    <!-- TOOLBAR -->
    <header class="toolbar">
      <div class="toolbar-left">
        <button class="btn-icon-soft" onclick="goBack()" title="Voltar">
          <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <div class="breadcrumb-trail" id="breadcrumbTrail">
          <div class="breadcrumb-item active" onclick="navigateTo('/')">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            Root
          </div>
        </div>
      </div>

      <div class="toolbar-right">
        <div class="search-bar">
          <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" placeholder="Buscar arquivos..." oninput="handleSearch(this.value)">
        </div>

        <div class="segmented-control">
          <button class="segmented-btn active" id="btnGrid" onclick="setView('grid')">
            <svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect></svg>
          </button>
          <button class="segmented-btn" id="btnList" onclick="setView('list')">
            <svg class="svg-icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          </button>
        </div>

        <button class="btn-primary-sm" style="margin:0;padding:8px 16px" onclick="openUploadModal()">
          Upload
        </button>
      </div>
    </header>

    <!-- VIEWPORT -->
    <div class="viewport" id="viewport"
         ondragover="event.preventDefault(); document.getElementById('dropOverlay').classList.add('active')"
         ondragleave="document.getElementById('dropOverlay').classList.remove('active')"
         ondrop="handleDrop(event)">
      
      <div class="drop-zone-overlay" id="dropOverlay">
        <div class="box">
          <svg class="svg-icon xl" viewBox="0 0 24 24" style="color:var(--accent);margin-bottom:16px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <h2 style="font-weight:800;font-size:22px">Solte para Enviar</h2>
        </div>
      </div>

      <div id="fileContainer"></div>
    </div>
  </main>
</div>

<!-- CONTEXT MENU -->
<div class="nova-menu" id="novaMenu">
  <button class="nova-menu-item" onclick="triggerAction('download')">
    <span>Download</span>
    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
  </button>
  <button class="nova-menu-item" onclick="triggerAction('preview')">
    <span>Visualizar</span>
    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
  </button>
  <button class="nova-menu-item" onclick="triggerAction('rename')">
    <span>Renomear</span>
    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
  </button>
  <div class="nova-menu-sep"></div>
  <button class="nova-menu-item danger" onclick="triggerAction('delete')">
    <span>Excluir</span>
    <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
  </button>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="nova-modal" id="modalWindow"></div>
</div>

<!-- TOASTS -->
<div class="toast-rack" id="toastRack"></div>

<script>
// ============================================================================
// STATE & API
// ============================================================================
const state = {
  token: null,
  user: null,
  currentPath: '/',
  items: [],
  selected: new Set(),
  viewMode: 'grid',
  searchQuery: '',
  activeItem: null,
};

const API = window.location.origin + '/api';


async function fetchApi(method, path, body = null) {
  const opts = {
    method,
    headers: { 'Authorization': `Bearer ${state.token}` }
  };
  if (state.secureCode) {
    opts.headers['X-Secure-Code'] = state.secureCode;
  }
  if (body instanceof FormData) {
    opts.body = body;
  } else if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let res = await fetch(API + path, opts);
  if (res.status === 403) {
    const err = await res.clone().json().catch(() => ({}));
    if (err.detail && err.detail.includes('Código de segurança')) {
      const code = await promptSecureCode();
      if (!code) throw new Error('Ação cancelada: Código de segurança necessário');
      state.secureCode = code;
      opts.headers['X-Secure-Code'] = code;
      res = await fetch(API + path, opts);
    }
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || 'Erro na requisição');
  }
  return res.json().catch(() => ({}));
}

function promptSecureCode() {
  return new Promise(resolve => {
    showModal(`
      <div class="modal-header">
        <h3>🔐 Proteção de Sistema</h3>
      </div>
      <div class="modal-body">
        <p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px;line-height:1.5">Você está modificando um diretório de sistema crítico. Insira o código seguro (Padrão: 123456):</p>
        <input type="password" id="secCode" style="width:100%;padding:14px 16px;border-radius:var(--radius-full);border:1px solid var(--border);background:var(--bg-card);color:white;outline:none" placeholder="Código Seguro">
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="resolveSecureCode(null)">Cancelar</button>
        <button class="btn-primary-sm" onclick="resolveSecureCode(document.getElementById('secCode').value)">Verificar</button>
      </div>
    `);
    setTimeout(() => document.getElementById('secCode').focus(), 100);
    window.currentSecureResolve = resolve;
  });
}

function resolveSecureCode(val) {
  closeModal();
  if (window.currentSecureResolve) {
    window.currentSecureResolve(val);
    window.currentSecureResolve = null;
  }
}


// ============================================================================
// AUTH
// ============================================================================
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginErr');
  btn.disabled = true;
  btn.textContent = 'Verificando...';
  err.classList.remove('show');

  try {
    const payload = {
      username: document.getElementById('loginUser').value.trim(),
      password: document.getElementById('loginPass').value
    };
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({ detail: 'Credenciais inválidas' }));
      throw new Error(data.detail || 'Falha no login');
    }
    const data = await res.json();
    state.token = data.token;
    state.user = data.user;

    document.getElementById('loginScreen').classList.add('hidden');
    loadFiles('/');
    loadStorage();
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.add('show');
    // Trigger shake animation manually if needed
    err.style.animation = 'none';
    setTimeout(() => err.style.animation = '', 10);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar no Drive';
  }
};

// ============================================================================
// FILE RENDERING
// ============================================================================
async function loadFiles(path) {
  state.currentPath = path;
  state.selected.clear();
  const container = document.getElementById('fileContainer');
  container.innerHTML = '<div class="empty-view"><p>Carregando...</p></div>';

  try {
    const params = new URLSearchParams({ path });
    if (state.searchQuery) params.set('search', state.searchQuery);
    const data = await fetchApi('GET', '/files?' + params);
    state.items = data.items;
    renderViewport(data);
    renderBreadcrumbs(data.breadcrumbs);
  } catch (e) {
    container.innerHTML = `<div class="empty-view"><h3 style="color:var(--system-red)">Erro</h4><p>${e.message}</p></div>`;
  }
}

function renderViewport(data) {
  const container = document.getElementById('fileContainer');
  if (!data.items || data.items.length === 0) {
    container.innerHTML = `
      <div class="empty-view">
        <svg class="svg-icon xl" viewBox="0 0 24 24" style="color:var(--accent)"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <h3>Tudo limpo por aqui</h3>
        <p>Arraste arquivos ou clique no botão de upload.</p>
      </div>
    `;
    return;
  }

  if (state.viewMode === 'grid') {
    container.innerHTML = `<div class="file-grid">${data.items.map((item, i) => `
      <div class="grid-card ${state.selected.has(item.path) ? 'selected' : ''}"
           style="animation-delay: ${i * 0.03}s"
           onclick="selectItem('${item.path}', event)"
           ondblclick="${item.is_dir ? `navigateTo('${item.path}')` : `openPreview('${item.path}')`}"
           oncontextmenu="openContextMenu(event, '${item.path}')">
        <div class="icon-wrapper ${item.icon}">
          ${getIconSvg(item)}
        </div>
        <div class="title" title="${item.name}">${item.name}</div>
        <div class="meta">${item.is_dir ? 'Pasta' : item.size_formatted}</div>
      </div>
    `).join('')}</div>`;
  } else {
    container.innerHTML = `
      <div class="file-list">
        <div class="list-header">
          <div>Nome</div>
          <div>Tamanho</div>
          <div>Modificado</div>
          <div></div>
        </div>
        ${data.items.map((item, i) => `
          <div class="list-row ${state.selected.has(item.path) ? 'selected' : ''}"
               style="animation-delay: ${i * 0.02}s"
               onclick="selectItem('${item.path}', event)"
               ondblclick="${item.is_dir ? `navigateTo('${item.path}')` : `openPreview('${item.path}')`}"
               oncontextmenu="openContextMenu(event, '${item.path}')">
            <div class="name-col">
              <span class="icon-wrapper ${item.icon}">${getIconSvg(item)}</span>
              <span class="name-text">${item.name}</span>
            </div>
            <div class="size-col">${item.is_dir ? '—' : item.size_formatted}</div>
            <div class="date-col">${formatDate(item.modified)}</div>
            <div></div>
          </div>
        `).join('')}
      </div>
    `;
  }
}

function renderBreadcrumbs(crumbs) {
  const trail = document.getElementById('breadcrumbTrail');
  trail.innerHTML = `
    <div class="breadcrumb-item ${state.currentPath === '/' ? 'active' : ''}" onclick="navigateTo('/')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      Root
    </div>
  `;
  if (crumbs) {
    crumbs.forEach((c, idx) => {
      const isActive = idx === crumbs.length - 1;
      trail.innerHTML += `
        <span class="breadcrumb-sep">/</span>
        <div class="breadcrumb-item ${isActive ? 'active' : ''}" onclick="navigateTo('${c.path}')">${c.name}</div>
      `;
    });
  }
}

function navigateTo(path) {
  state.searchQuery = '';
  loadFiles(path);
}

function goBack() {
  const parts = state.currentPath.replace(/\/$/, '').split('/');
  parts.pop();
  navigateTo(parts.join('/') || '/');
}

// ============================================================================
// ICONS
// ============================================================================

function getIconSvg(item) {
  if (item.is_dir) return `<svg class="svg-icon lg" style="color:#3b82f6" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`;
  
  const ext = item.extension || '';
  if (item.icon === 'image') return `<svg class="svg-icon lg" style="color:#f59e0b" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`;
  if (item.icon === 'video') return `<svg class="svg-icon lg" style="color:#ef4444" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`;
  if (item.icon === 'audio') return `<svg class="svg-icon lg" style="color:#10b981" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>`;
  if (item.icon === 'code' || ['.json','.xml','.yaml','.yml','.env','.css','.html','.sh'].includes(ext)) return `<svg class="svg-icon lg" style="color:#8b5cf6" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>`;
  if (item.icon === 'archive' || ['.zip','.rar','.7z','.tar','.gz'].includes(ext)) return `<svg class="svg-icon lg" style="color:#eab308" viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>`;
  if (item.icon === 'pdf' || ext === '.pdf') return `<svg class="svg-icon lg" style="color:#ef4444" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M16 13H8"></path><path d="M16 17H8"></path><path d="M10 9H8"></path></svg>`;
  
  if (['.doc','.docx','.odt'].includes(ext)) return `<svg class="svg-icon lg" style="color:#3b82f6" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M9 15l2-3 2 3"></path></svg>`;
  if (['.xls','.xlsx','.csv'].includes(ext)) return `<svg class="svg-icon lg" style="color:#10b981" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M8 13h8"></path><path d="M8 17h8"></path><path d="M12 13v4"></path></svg>`;
  if (['.ppt','.pptx'].includes(ext)) return `<svg class="svg-icon lg" style="color:#f97316" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><rect x="8" y="10" width="8" height="6"></rect></svg>`;
  
  return `<svg class="svg-icon lg" style="color:var(--text-secondary)" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`;
}


function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// ============================================================================
// ACTIONS
// ============================================================================
function selectItem(path, evt) {
  if (evt.ctrlKey || evt.metaKey) {
    if (state.selected.has(path)) state.selected.delete(path);
    else state.selected.add(path);
  } else {
    state.selected.clear();
    state.selected.add(path);
  }
  renderViewport({ items: state.items });
}

function setView(mode) {
  state.viewMode = mode;
  document.getElementById('btnGrid').classList.toggle('active', mode === 'grid');
  document.getElementById('btnList').classList.toggle('active', mode === 'list');
  renderViewport({ items: state.items });
}

let searchTimer;
function handleSearch(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.searchQuery = val;
    loadFiles(state.currentPath);
  }, 300);
}

function openContextMenu(e, path) {
  e.preventDefault();
  state.activeItem = path;
  if (!state.selected.has(path)) {
    state.selected.clear();
    state.selected.add(path);
    renderViewport({ items: state.items });
  }
  const menu = document.getElementById('novaMenu');
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.classList.add('show');
}

document.addEventListener('click', () => {
  document.getElementById('novaMenu').classList.remove('show');
});

function triggerAction(action) {
  const path = state.activeItem;
  if (!path) return;
  if (action === 'download') {
    window.open(`${API}/files/download?path=${encodeURIComponent(path)}&token=${state.token}`, '_blank');
  } else if (action === 'preview') {
    openPreview(path);
  } else if (action === 'rename') {
    promptRename(path);
  } else if (action === 'delete') {
    confirmDelete(path);
  }
}

// ============================================================================
// MODALS
// ============================================================================
function openUploadModal() {
  showModal(`
    <div class="modal-header">
      <h3>Upload File</h3>
    </div>
    <div class="modal-body">
      <div style="border:2px dashed var(--border);border-radius:var(--radius-md);padding:48px 32px;text-align:center;cursor:pointer;background:var(--bg-card);transition:var(--bounce)"
           onmouseover="this.style.background='var(--bg-card-hover)';this.style.borderColor='var(--accent)'"
           onmouseout="this.style.background='var(--bg-card)';this.style.borderColor='var(--border)'"
           onclick="document.getElementById('modalFileInput').click()">
        <svg class="svg-icon xl" viewBox="0 0 24 24" style="color:var(--accent);margin-bottom:16px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <p style="font-size:16px;font-weight:700">Browse ou solte os arquivos aqui</p>
        <input type="file" id="modalFileInput" multiple hidden onchange="doUpload(this.files)">
      </div>
      <div id="uploadStatus" style="margin-top:20px;font-size:14px;font-weight:600;text-align:center"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
    </div>
  `);
}

async function doUpload(files) {
  const status = document.getElementById('uploadStatus');
  const form = new FormData();
  form.append('path', state.currentPath);
  for (const f of files) form.append('files', f);

  status.innerHTML = '<span style="color:var(--accent)">Processando upload...</span>';
  try {
    const data = await fetchApi('POST', '/files/upload', form);
    status.innerHTML = `<span style="color:var(--system-green)">✅ Upload de ${data.uploaded} item(ns) concluído.</span>`;
    setTimeout(() => { closeModal(); loadFiles(state.currentPath); }, 1200);
  } catch (e) {
    status.innerHTML = `<span style="color:var(--system-red)">❌ ${e.message}</span>`;
  }
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropOverlay').classList.remove('active');
  if (e.dataTransfer.files.length > 0) {
    openUploadModal();
    setTimeout(() => doUpload(e.dataTransfer.files), 200);
  }
}

function promptFolder() {
  showModal(`
    <div class="modal-header">
      <h3>Criar Pasta</h3>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Nome da pasta</label>
        <input type="text" id="newFolderName" placeholder="Ex: Projetos" autofocus>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary-sm" onclick="createFolder()">Criar</button>
    </div>
  `);
  setTimeout(() => document.getElementById('newFolderName')?.focus(), 100);
}

async function createFolder() {
  const name = document.getElementById('newFolderName').value.trim();
  if (!name) return;
  try {
    const form = new FormData();
    form.append('path', state.currentPath);
    form.append('name', name);
    await fetchApi('POST', '/files/folder', form);
    closeModal();
    toast('Pasta criada com sucesso');
    loadFiles(state.currentPath);
  } catch (e) {
    toast(e.message, 'error');
  }
}

function promptRename(path) {
  const item = state.items.find(i => i.path === path);
  showModal(`
    <div class="modal-header">
      <h3>Renomear Item</h3>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Novo nome</label>
        <input type="text" id="renameValue" value="${item ? item.name : ''}">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary-sm" onclick="executeRename('${path}')">Salvar Nome</button>
    </div>
  `);
}

async function executeRename(path) {
  const name = document.getElementById('renameValue').value.trim();
  if (!name) return;
  try {
    const form = new FormData();
    form.append('path', path);
    form.append('new_name', name);
    await fetchApi('PUT', '/files/rename', form);
    closeModal();
    toast('Item renomeado');
    loadFiles(state.currentPath);
  } catch (e) {
    toast(e.message, 'error');
  }
}

function confirmDelete(path) {
  showModal(`
    <div class="modal-header">
      <h3>Excluir Item</h3>
    </div>
    <div class="modal-body">
      <p style="font-size:15px;color:var(--text-secondary)">Tem certeza que deseja apagar este item? Ele será enviado para a Lixeira.</p>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary-sm btn-danger-sm" onclick="executeDelete('${path}')">Sim, Apagar</button>
    </div>
  `);
}

async function executeDelete(path) {
  try {
    await fetchApi('DELETE', `/files?path=${encodeURIComponent(path)}`);
    closeModal();
    toast('Movido para a lixeira');
    loadFiles(state.currentPath);
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function openPreview(path) {
  const item = state.items.find(i => i.path === path);
  if (!item) return;

  const url = `${API}/files/download?path=${encodeURIComponent(path)}&token=${state.token}`;

  if (item.icon === 'image') {
    showModal(`
      <div class="modal-header">
        <h3>${item.name}</h3>
      </div>
      <div class="modal-body" style="text-align:center;background:var(--bg-main)">
        <img src="${url}" style="max-width:100%;max-height:60vh;border-radius:var(--radius-sm);box-shadow:var(--shadow-float)">
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Fechar</button>
      </div>
    `);
    return;
  }

  if (item.icon === 'video') {
    showModal(`
      <div class="modal-header">
        <h3>${item.name}</h3>
      </div>
      <div class="modal-body" style="text-align:center;background:#000">
        <video controls autoplay style="max-width:100%;max-height:60vh;border-radius:var(--radius-sm);outline:none">
          <source src="${url}">
          Seu navegador não suporta a reprodução deste vídeo.
        </video>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Fechar</button>
      </div>
    `);
    return;
  }

  if (item.icon === 'audio') {
    showModal(`
      <div class="modal-header">
        <h3>${item.name}</h3>
      </div>
      <div class="modal-body" style="text-align:center;padding:40px 20px">
        <svg class="svg-icon xl" viewBox="0 0 24 24" style="color:var(--accent);margin-bottom:24px"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        <audio controls autoplay style="width:100%;outline:none">
          <source src="${url}">
          Seu navegador não suporta a reprodução de áudio.
        </audio>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Fechar</button>
      </div>
    `);
    return;
  }

  if (item.icon === 'pdf') {
    showModal(`
      <div class="modal-header">
        <h3>${item.name}</h3>
      </div>
      <div class="modal-body" style="padding:0;height:65vh">
        <iframe src="${url}" style="width:100%;height:100%;border:none"></iframe>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Fechar</button>
        <button class="btn-primary-sm" onclick="window.open('${url}', '_blank')">Abrir PDF</button>
      </div>
    `);
    return;
  }

  try {
    const data = await fetchApi('GET', '/files/preview?path=' + encodeURIComponent(path));
    showModal(`
      <div class="modal-header">
        <h3>${item.name}</h3>
      </div>
      <div class="modal-body" style="padding:16px">
        <textarea class="code-editor" id="codeContent">${escapeHtml(data.content)}</textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn-primary-sm" onclick="saveCode('${path}')">Salvar Edição</button>
      </div>
    `);
  } catch (e) {
    // Fallback: Mostrar modal com botão de download
    showModal(`
      <div class="modal-header">
        <h3>${item.name}</h3>
      </div>
      <div class="modal-body" style="text-align:center;padding:60px 20px">
        <svg class="svg-icon xl" viewBox="0 0 24 24" style="color:var(--text-tertiary);margin-bottom:16px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
        <p style="color:var(--text-secondary);font-size:15px;margin-bottom:16px">Este tipo de arquivo (${item.extension || 'desconhecido'}) não pode ser visualizado no navegador.</p>
        <button class="btn-primary-sm" onclick="window.open('${url}', '_blank')">Fazer Download</button>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Fechar</button>
      </div>
    `);
  }
}

async function saveCode(path) {
  const content = document.getElementById('codeContent').value;
  try {
    const form = new FormData();
    form.append('path', path);
    form.append('content', content);
    await fetchApi('PUT', '/files/save', form);
    closeModal();
    toast('Edições salvas com sucesso', 'success');
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function loadStorage() {
  try {
    const data = await fetchApi('GET', '/storage');
    document.getElementById('storageLabel').textContent = `${data.used_formatted} / ${data.total_formatted}`;
    document.getElementById('storageMeter').style.width = Math.min(data.percent_used, 100) + '%';
  } catch (e) {}
}

function showModal(html) {
  document.getElementById('modalWindow').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('show');
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('show');
}

function toast(msg) {
  const rack = document.getElementById('toastRack');
  const t = document.createElement('div');
  t.className = 'nova-toast';
  t.innerHTML = `<svg class="svg-icon" viewBox="0 0 24 24" style="color:var(--accent)"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> <span>${msg}</span>`;
  rack.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>

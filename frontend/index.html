function promptRename(path) {
  const item = state.items.find(i => i.path === path);
  showModal(`
    <div class="modal-header">
      <h3>Renomear Item</h3>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Novo nome</label>
        <input type="text" id="renameValue" value="${item ? item.name : ''}">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary-sm" onclick="executeRename('${path}')">Salvar Nome</button>
    </div>
  `);
}

async function executeRename(path) {
  const name = document.getElementById('renameValue').value.trim();
  if (!name) return;
  try {
    const form = new FormData();
    form.append('path', path);
    form.append('new_name', name);
    await fetchApi('PUT', '/files/rename', form);
    closeModal();
    toast('Item renomeado');
    loadFiles(state.currentPath);
  } catch (e) {
    toast(e.message, 'error');
  }
}

function confirmDelete(path) {
  showModal(`
    <div class="modal-header">
      <h3>Excluir Item</h3>
    </div>
    <div class="modal-body">
      <p style="font-size:15px;color:var(--text-secondary)">Tem certeza que deseja apagar este item? Ele será enviado para a Lixeira.</p>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary-sm btn-danger-sm" onclick="executeDelete('${path}')">Sim, Apagar</button>
    </div>
  `);
}

async function executeDelete(path) {
  try {
    await fetchApi('DELETE', `/files?path=${encodeURIComponent(path)}`);
    closeModal();
    toast('Movido para a lixeira');
    loadFiles(state.currentPath);
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function openPreview(path) {
  const item = state.items.find(i => i.path === path);
  if (!item) return;

  const url = `${API}/files/download?path=${encodeURIComponent(path)}&token=${state.token}`;

  if (item.icon === 'image') {
    state.galleryImages = state.items.filter(i => i.icon === 'image');
    state.currentGalleryIndex = state.galleryImages.findIndex(i => i.path === path);
    renderGalleryModal();
    return;
  }

  if (item.icon === 'video') {
    showModal(`
      <div class="modal-header">
        <h3>${item.name}</h3>
      </div>
      <div class="modal-body" style="text-align:center;background:#000">
        <video controls autoplay style="max-width:100%;max-height:60vh;border-radius:var(--radius-sm);outline:none">
          <source src="${url}">
          Seu navegador não suporta a reprodução deste vídeo.
        </video>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Fechar</button>
      </div>
    `);
    return;
  }

  if (item.icon === 'audio') {
    showModal(`
      <div class="modal-header">
        <h3>${item.name}</h3>
      </div>
      <div class="modal-body" style="text-align:center;padding:40px 20px">
        <svg class="svg-icon xl" viewBox="0 0 24 24" style="color:var(--accent);margin-bottom:24px"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        <audio controls autoplay style="width:100%;outline:none">
          <source src="${url}">
          Seu navegador não suporta a reprodução de áudio.
        </audio>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Fechar</button>
      </div>
    `);
    return;
  }

  if (item.icon === 'pdf') {
    showModal(`
      <div class="modal-header">
        <h3>${item.name}</h3>
      </div>
      <div class="modal-body" style="padding:0;height:65vh">
        <iframe src="${url}" style="width:100%;height:100%;border:none"></iframe>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Fechar</button>
        <button class="btn-primary-sm" onclick="window.open('${url}', '_blank')">Abrir PDF</button>
      </div>
    `);
    return;
  }

  try {
    const data = await fetchApi('GET', '/files/preview?path=' + encodeURIComponent(path));
    showModal(`
      <div class="modal-header">
        <h3>${item.name}</h3>
      </div>
      <div class="modal-body" style="padding:16px">
        <textarea class="code-editor" id="codeContent">${escapeHtml(data.content)}</textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn-primary-sm" onclick="saveCode('${path}')">Salvar Edição</button>
      </div>
    `);
  } catch (e) {
    // Fallback: Mostrar modal com botão de download
    showModal(`
      <div class="modal-header">
        <h3>${item.name}</h3>
      </div>
      <div class="modal-body" style="text-align:center;padding:60px 20px">
        <svg class="svg-icon xl" viewBox="0 0 24 24" style="color:var(--text-tertiary);margin-bottom:16px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
        <p style="color:var(--text-secondary);font-size:15px;margin-bottom:16px">Este tipo de arquivo (${item.extension || 'desconhecido'}) não pode ser visualizado no navegador.</p>
        <button class="btn-primary-sm" onclick="window.open('${url}', '_blank')">Fazer Download</button>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Fechar</button>
      </div>
    `);
  }
}

async function saveCode(path) {
  const content = document.getElementById('codeContent').value;
  try {
    const form = new FormData();
    form.append('path', path);
    form.append('content', content);
    await fetchApi('PUT', '/files/save', form);
    closeModal();
    toast('Edições salvas com sucesso', 'success');
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function loadStorage() {
  try {
    const data = await fetchApi('GET', '/storage');
    document.getElementById('storageLabel').textContent = `${data.used_formatted} / ${data.total_formatted}`;
    document.getElementById('storageMeter').style.width = Math.min(data.percent_used, 100) + '%';
  } catch (e) {}
}

let currentAnalyzerPath = '/';
let currentAnalyzerTab = 'folders';
let analyzerData = null;

async function openStorageAnalyzer(targetPath = null) {
  if (!targetPath) {
    targetPath = state.currentPath || '/workspace';
  }
  currentAnalyzerPath = targetPath;
  
  showModal(`
    <div class="analyzer-modal">
      <div class="modal-header" style="padding-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <svg class="svg-icon lg" style="color:var(--accent)" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
          <div>
            <h3 style="font-size:18px">Analisador de Espaço em Disco</h3>
            <p style="font-size:12px;color:var(--text-secondary);margin:0">Descubra com precisão qual pasta está consumindo mais espaço</p>
          </div>
        </div>
        <button class="btn-icon-soft" onclick="closeModal()" title="Fechar">✕</button>
      </div>

      <div class="modal-body" style="padding:16px 24px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-size:12px;color:var(--text-tertiary);font-weight:600">ANALISANDO:</span>
            <button class="filter-chip ${currentAnalyzerPath === state.currentPath ? 'active' : ''}" onclick="openStorageAnalyzer('${state.currentPath}')">Pasta Atual (${state.currentPath})</button>
            <button class="filter-chip ${currentAnalyzerPath === '/workspace' ? 'active' : ''}" onclick="openStorageAnalyzer('/workspace')">Workspace</button>
            <button class="filter-chip ${currentAnalyzerPath === '/' ? 'active' : ''}" onclick="openStorageAnalyzer('/')">Raiz / Sistema</button>
          </div>
          <button class="btn-icon-soft" onclick="openStorageAnalyzer('${currentAnalyzerPath}')" title="Atualizar Análise" style="font-size:12px;padding:6px 12px;display:flex;align-items:center;gap:6px">
            <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            <span>Recalcular</span>
          </button>
        </div>

        <div id="analyzerContent">
          <div class="empty-view" style="padding:40px 0">
            <svg class="svg-icon xl" style="color:var(--accent);animation:pulseGlow 1.5s linear infinite" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <h4 style="margin-top:12px;font-size:15px">Calculando uso de espaço e ranking das pastas...</h4>
          </div>
        </div>
      </div>
    </div>
  `);

  try {
    const data = await fetchApi('GET', `/storage/breakdown?path=${encodeURIComponent(currentAnalyzerPath)}`);
    analyzerData = data;
    renderAnalyzerBody();
  } catch (err) {
    const content = document.getElementById('analyzerContent');
    if (content) {
      content.innerHTML = `
        <div class="empty-view" style="padding:30px 0">
          <h4 style="color:var(--system-red);margin-bottom:8px">Erro ao analisar disco</h4>
          <p style="font-size:13px">${err.message}</p>
        </div>
      `;
    }
  }
}

function renderAnalyzerBody() {
  if (!analyzerData) return;
  const d = analyzerData;
  const container = document.getElementById('analyzerContent');
  if (!container) return;

  const heaviest = d.heaviest_folder;

  let heaviestHtml = '';
  if (heaviest && heaviest.size > 0) {
    heaviestHtml = `
      <div class="heaviest-spotlight">
        <div>
          <div class="heaviest-badge">
            🏆 Pasta que mais ocupa espaço
          </div>
          <div class="heaviest-title">
            <svg class="svg-icon lg" style="color:#f59e0b" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            <span>${heaviest.name}</span>
          </div>
          <div class="heaviest-path">${heaviest.path}</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:6px">
            Contém ${heaviest.files_count || 0} arquivos e ${heaviest.dirs_count || 0} subpastas
          </div>
        </div>
        <div class="heaviest-stat">
          <div class="heaviest-size">${heaviest.size_formatted}</div>
          <div class="heaviest-percent">${heaviest.percent}% do total analisado</div>
          <button class="btn-primary-sm" style="margin-top:10px;padding:6px 14px;font-size:12px" onclick="closeModal();navigateTo('${heaviest.path}')">
            Abrir Pasta
          </button>
        </div>
      </div>
    `;
  } else {
    heaviestHtml = `
      <div class="heaviest-spotlight" style="background:rgba(255,255,255,0.03);border-color:var(--border)">
        <div>
          <div class="heaviest-title">Diretório Vazio ou Sem Pastas Pesadas</div>
          <div class="heaviest-path">${d.analyzed_path}</div>
        </div>
      </div>
    `;
  }

  const statsHtml = `
    <div class="analyzer-stats-grid">
      <div class="analyzer-stat-card">
        <span class="label">Conteúdo Analisado</span>
        <span class="val">${d.total_content_size_formatted}</span>
      </div>
      <div class="analyzer-stat-card">
        <span class="label">Subpastas Encontradas</span>
        <span class="val">${d.direct_folders_count}</span>
      </div>
      <div class="analyzer-stat-card">
        <span class="label">Arquivos Diretos</span>
        <span class="val">${d.direct_files_count} (${d.direct_files_size_formatted})</span>
      </div>
      <div class="analyzer-stat-card">
        <span class="label">Espaço Livre no Disco</span>
        <span class="val" style="color:var(--system-green)">${d.disk_free_formatted}</span>
      </div>
    </div>
  `;

  const tabsHtml = `
    <div class="analyzer-tabs">
      <button class="analyzer-tab-btn ${currentAnalyzerTab === 'folders' ? 'active' : ''}" onclick="switchAnalyzerTab('folders')">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <span>Pastas neste Diretório (${d.folders.length})</span>
      </button>
      <button class="analyzer-tab-btn ${currentAnalyzerTab === 'top_folders' ? 'active' : ''}" onclick="switchAnalyzerTab('top_folders')">
        <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        <span>🔥 Top 10 Maiores Pastas (Geral)</span>
      </button>
      <button class="analyzer-tab-btn ${currentAnalyzerTab === 'top_files' ? 'active' : ''}" onclick="switchAnalyzerTab('top_files')">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>
        <span>📄 Top 10 Maiores Arquivos</span>
      </button>
    </div>
  `;

  let listHtml = '';
  if (currentAnalyzerTab === 'folders') {
    if (!d.folders || d.folders.length === 0) {
      listHtml = '<div class="empty-view" style="padding:20px 0"><p>Nenhuma subpasta neste diretório.</p></div>';
    } else {
      listHtml = `<div class="analyzer-list">` + d.folders.map((f, idx) => {
        const rankClass = idx === 0 ? 'gold' : (idx === 1 ? 'silver' : (idx === 2 ? 'bronze' : ''));
        const medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : `#${idx + 1}`));
        const isHeavy = f.percent >= 40;
        return `
          <div class="analyzer-row">
            <div class="analyzer-rank ${rankClass}">${medal}</div>
            <div class="analyzer-row-info">
              <div class="analyzer-row-name">
                <svg class="svg-icon" style="color:#3b82f6" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <span title="${f.name}">${f.name}</span>
                ${f.is_heaviest ? '<span style="font-size:10px;padding:2px 6px;border-radius:99px;background:rgba(245,158,11,0.2);color:#fbbf24;font-weight:700">MAIOR</span>' : ''}
              </div>
              <div class="analyzer-row-sub">${f.path} • ${f.files_count || 0} arquivos</div>
            </div>
            <div class="analyzer-bar-col">
              <div class="analyzer-mini-bar">
                <div class="analyzer-mini-bar-fill ${isHeavy ? 'heavy' : ''}" style="width: ${Math.max(f.percent, 3)}%"></div>
              </div>
              <span class="analyzer-bar-percent">${f.percent}%</span>
            </div>
            <div class="analyzer-row-size">${f.size_formatted}</div>
            <div class="analyzer-row-action">
              <button onclick="closeModal();navigateTo('${f.path}')">Abrir</button>
            </div>
          </div>
        `;
      }).join('') + `</div>`;
    }
  } else if (currentAnalyzerTab === 'top_folders') {
    if (!d.top_folders || d.top_folders.length === 0) {
      listHtml = '<div class="empty-view" style="padding:20px 0"><p>Nenhuma pasta encontrada.</p></div>';
    } else {
      const maxTopSize = d.top_folders[0]?.size || 1;
      listHtml = `<div class="analyzer-list">` + d.top_folders.map((f, idx) => {
        const medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : `#${idx + 1}`));
        const percentRel = Math.round((f.size / maxTopSize) * 100);
        return `
          <div class="analyzer-row">
            <div class="analyzer-rank">${medal}</div>
            <div class="analyzer-row-info">
              <div class="analyzer-row-name">
                <svg class="svg-icon" style="color:#3b82f6" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <span title="${f.name}">${f.name}</span>
              </div>
              <div class="analyzer-row-sub">${f.path} • ${f.files_count || 0} arquivos</div>
            </div>
            <div class="analyzer-bar-col">
              <div class="analyzer-mini-bar">
                <div class="analyzer-mini-bar-fill" style="width: ${Math.max(percentRel, 3)}%"></div>
              </div>
              <span class="analyzer-bar-percent">${percentRel}% do maior</span>
            </div>
            <div class="analyzer-row-size">${f.size_formatted}</div>
            <div class="analyzer-row-action">
              <button onclick="closeModal();navigateTo('${f.path}')">Abrir</button>
            </div>
          </div>
        `;
      }).join('') + `</div>`;
    }
  } else if (currentAnalyzerTab === 'top_files') {
    if (!d.top_files || d.top_files.length === 0) {
      listHtml = '<div class="empty-view" style="padding:20px 0"><p>Nenhum arquivo encontrado.</p></div>';
    } else {
      listHtml = `<div class="analyzer-list">` + d.top_files.map((file, idx) => {
        const medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : `#${idx + 1}`));
        return `
          <div class="analyzer-row">
            <div class="analyzer-rank">${medal}</div>
            <div class="analyzer-row-info">
              <div class="analyzer-row-name">
                <span class="icon-wrapper ${file.icon}">${getIconSvg(file)}</span>
                <span title="${file.name}">${file.name}</span>
              </div>
              <div class="analyzer-row-sub">${file.path}</div>
            </div>
            <div></div>
            <div class="analyzer-row-size">${file.size_formatted}</div>
            <div class="analyzer-row-action">
              <button onclick="closeModal();openPreview('${file.path}')">Ver</button>
            </div>
          </div>
        `;
      }).join('') + `</div>`;
    }
  }

  container.innerHTML = heaviestHtml + statsHtml + tabsHtml + listHtml;
}

function switchAnalyzerTab(tab) {
  currentAnalyzerTab = tab;
  renderAnalyzerBody();
}


function renderGalleryModal() {
  const item = state.galleryImages[state.currentGalleryIndex];
  if (!item) return;
  const url = `${API}/files/download?path=${encodeURIComponent(item.path)}&token=${state.token}`;
  
  const isFirst = state.currentGalleryIndex === 0;
  const isLast = state.currentGalleryIndex === state.galleryImages.length - 1;

  showModal(`
    <div class="modal-header" style="justify-content:center;position:relative">
      <h3 style="flex:1;text-align:center">${item.name} <span style="font-size:12px;color:var(--text-secondary);font-weight:500">(${state.currentGalleryIndex + 1}/${state.galleryImages.length})</span></h3>
    </div>
    <div class="modal-body" style="display:flex;align-items:center;justify-content:center;background:var(--bg-main);position:relative;padding:0;min-height:50vh">
      
      <button onclick="prevGalleryImage()" style="position:absolute;left:20px;z-index:10;background:rgba(0,0,0,0.5);border:none;border-radius:50%;width:44px;height:44px;color:white;cursor:pointer;display:${isFirst ? 'none' : 'flex'};align-items:center;justify-content:center;transition:transform 0.2s">
        <svg class="svg-icon lg" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>

      <img src="${url}" style="max-width:100%;max-height:70vh;object-fit:contain;box-shadow:var(--shadow-float)">
      
      <button onclick="nextGalleryImage()" style="position:absolute;right:20px;z-index:10;background:rgba(0,0,0,0.5);border:none;border-radius:50%;width:44px;height:44px;color:white;cursor:pointer;display:${isLast ? 'none' : 'flex'};align-items:center;justify-content:center;transition:transform 0.2s">
        <svg class="svg-icon lg" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Fechar</button>
      <button class="btn-primary-sm" onclick="window.open('${url}', '_blank')">Original</button>
    </div>
  `);
}

function prevGalleryImage() {
  if (state.currentGalleryIndex > 0) {
    state.currentGalleryIndex--;
    renderGalleryModal();
  }
}

function nextGalleryImage() {
  if (state.currentGalleryIndex < state.galleryImages.length - 1) {
    state.currentGalleryIndex++;
    renderGalleryModal();
  }
}

function showModal(html) {
  document.getElementById('modalWindow').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('show');
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('show');
  state.galleryImages = [];
}

function toast(msg) {
  const rack = document.getElementById('toastRack');
  const t = document.createElement('div');
  t.className = 'nova-toast';
  t.innerHTML = `<svg class="svg-icon" viewBox="0 0 24 24" style="color:var(--accent)"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> <span>${msg}</span>`;
  rack.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ============================================================================
// MOBILE SIDEBAR TOGGLE
// ============================================================================
// Abre/fecha a gaveta lateral (drawer) em mobile/tablet
function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (!sidebar) return;
  sidebar.classList.toggle('open');
  if (overlay) overlay.classList.toggle('active');
}

// Recolhe a sidebar no desktop (modo ícones)
function toggleDesktopSidebar() {
  const sidebar = document.querySelector('.sidebar');
  if (!sidebar) return;
  sidebar.classList.toggle('collapsed');
}

// Fecha/recolhe a sidebar ao clicar fora dela
document.addEventListener('click', function(e) {
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const toggleBtn = document.querySelector('.menu-toggle-btn');
  const brandTitle = document.querySelector('.brand-title');
  if (!sidebar) return;

  // Elementos que NÃO devem disparar o fechamento (botões de abrir/fechar)
  const clickedToggle = (toggleBtn && toggleBtn.contains(e.target)) || (brandTitle && brandTitle.contains(e.target));
  const clickedInsideSidebar = sidebar.contains(e.target);

  // Cliques dentro de modais ou menus de contexto não devem fechar a gaveta
  const clickedInOverlayUI = e.target.closest('.modal-backdrop') || e.target.closest('.nova-menu');

  if (sidebar.classList.contains('open')) {
    // Mobile/tablet: fecha a gaveta
    if (!clickedInsideSidebar && !clickedToggle) {
      sidebar.classList.remove('open');
      if (overlay) overlay.classList.remove('active');
    }
  } else if (window.innerWidth > 768 && !sidebar.classList.contains('collapsed')) {
    // Desktop: recolhe a sidebar quando clica fora (na área de conteúdo)
    if (!clickedInsideSidebar && !clickedToggle && !clickedInOverlayUI) {
      sidebar.classList.add('collapsed');
    }
  }
});

// Mostra/esconde o botão hamburger conforme o tamanho da tela
function refreshMenuToggleVisibility() {
  const menuBtn = document.querySelector('.menu-toggle-btn');
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (!menuBtn || !sidebar) return;

  if (window.innerWidth > 480 && window.innerWidth <= 768) {
    menuBtn.style.display = 'inline-flex';
  } else {
    menuBtn.style.display = 'none';
    sidebar.classList.remove('open');
    if (overlay) overlay.classList.remove('active');
  }
}

refreshMenuToggleVisibility();
window.addEventListener('resize', refreshMenuToggleVisibility);
window.addEventListener('load', refreshMenuToggleVisibility);


// ============================================================================
// P5.JS FLOW FIELD BACKGROUND WITH MOUSE FOLLOW
// ============================================================================
const FLOW_CONFIG = {
  particleCount: window.innerWidth < 768 ? 200 : 500, // Menos partículas no mobile
  noiseScale: 0.003,
  speed: 1.8,
  trailFade: 12,
  strokeW: 1.5,
  hueBase: 250, // Azul/Roxo (Combina com o NovaDrive)
  hueRange: 60,
};

let particles = [];
let targetMouseX = -1000;
let targetMouseY = -1000;

document.addEventListener('mousemove', (e) => {
  targetMouseX = e.clientX;
  targetMouseY = e.clientY;
});

function setup() {
  let canvas = createCanvas(windowWidth, windowHeight);
  canvas.parent('p5-canvas-container');
  colorMode(HSB, 360, 100, 100, 100);
  
  for (let i = 0; i < FLOW_CONFIG.particleCount; i++) {
    particles.push(new Particle());
  }
  background(230, 20, 5); // Fundo muito escuro
}

class Particle {
  constructor() {
    this.reset();
    this.vx = 0;
    this.vy = 0;
  }
  reset() {
    this.x = random(width);
    this.y = random(height);
    this.hueOffset = random(360);
    this.speedMul = random(0.5, 1.5);
  }
  update() {
    // Ruído Perlin (Flow Field)
    const angle = noise(this.x * FLOW_CONFIG.noiseScale, this.y * FLOW_CONFIG.noiseScale, frameCount * 0.0005) * TWO_PI * 4;
    this.vx += cos(angle) * 0.06;
    this.vy += sin(angle) * 0.06;
    
    // Efeito magnético do Mouse (Suave)
    if (targetMouseX !== -1000 && targetMouseY !== -1000) {
      let dx = targetMouseX - this.x;
      let dy = targetMouseY - this.y;
      let distSq = dx*dx + dy*dy;
      if (distSq < 60000) { // Raio de influência ~240px
        let force = 200 / (sqrt(distSq) + 50);
        this.vx += dx * force * 0.0005;
        this.vy += dy * force * 0.0005;
      }
    }

    // Limite de velocidade
    const mag = sqrt(this.vx * this.vx + this.vy * this.vy);
    if (mag > FLOW_CONFIG.speed * this.speedMul) {
      this.vx = (this.vx / mag) * FLOW_CONFIG.speed * this.speedMul;
      this.vy = (this.vy / mag) * FLOW_CONFIG.speed * this.speedMul;
    }
    
    this.x += this.vx;
    this.y += this.vy;

    // Reposiciona se sair da tela
    if (this.x < -10 || this.x > width + 10 || this.y < -10 || this.y > height + 10) {
      this.reset();
      // Reposiciona inteligentemente na borda ou aleatório
      if (random(1) < 0.5) {
        this.x = random(width);
        this.y = random(height);
      }
    }
  }
  display() {
    const noiseVal = noise(this.x * 0.002, this.y * 0.002, frameCount * 0.0003);
    const hue = (FLOW_CONFIG.hueBase + noiseVal * FLOW_CONFIG.hueRange + this.hueOffset * 0.1) % 360;
    const sat = 70 + noiseVal * 30;
    const bri = 80 + noiseVal * 20;
    const alpha = 40;
    
    stroke(hue, sat, bri, alpha);
    strokeWeight(FLOW_CONFIG.strokeW);
    point(this.x, this.y);
  }
}

function draw() {
  noStroke();
  // Fading para criar o rastro (Cores da paleta NovaDrive)
  fill(230, 20, 5, FLOW_CONFIG.trailFade);
  rect(0, 0, width, height);

  for (let p of particles) {
    p.update();
    p.display();
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  background(230, 20, 5);
}

</script>
</body>

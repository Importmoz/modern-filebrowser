<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaDrive</title>
<style>
/* ============================================================================
   VARIÁVEIS E RESET
   ============================================================================ */
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: rgba(255,255,255,0.04);
  --bg-card-hover: rgba(255,255,255,0.07);
  --bg-glass: rgba(255,255,255,0.03);
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.15);
  --text-primary: #f0f0f5;
  --text-secondary: rgba(255,255,255,0.55);
  --text-muted: rgba(255,255,255,0.35);
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --accent-gradient: linear-gradient(135deg, #6c5ce7, #00cec9);
  --success: #00b894;
  --warning: #fdcb6e;
  --danger: #e17055;
  --info: #74b9ff;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow: 0 8px 32px rgba(0,0,0,0.3);
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  user-select: none;
  overflow: hidden;
}

/* ============================================================================
   ANIMATED BACKGROUND
   ============================================================================ */
.bg-animated {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.bg-animated::before {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(108,92,231,0.12), transparent 70%);
  top: -200px; left: -200px;
  animation: float 20s ease-in-out infinite;
}
.bg-animated::after {
  content: '';
  position: absolute;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,206,201,0.08), transparent 70%);
  bottom: -150px; right: -150px;
  animation: float 25s ease-in-out infinite reverse;
}
@keyframes float {
  0%, 100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(30px,-30px) scale(1.05); }
  66% { transform: translate(-20px,20px) scale(0.95); }
}

/* ============================================================================
   LOGIN
   ============================================================================ */
.login-container {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  background: var(--bg-primary);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.login-container.hidden {
  opacity: 0;
  transform: scale(1.05);
  pointer-events: none;
}

.login-box {
  background: var(--bg-glass);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 48px 40px;
  width: 400px;
  max-width: 90vw;
  backdrop-filter: blur(20px);
  box-shadow: var(--shadow);
}

.login-logo {
  text-align: center;
  margin-bottom: 36px;
}
.login-logo .logo-icon {
  width: 56px; height: 56px;
  background: var(--accent-gradient);
  border-radius: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(108,92,231,0.3);
}
.login-logo h1 {
  font-size: 24px;
  font-weight: 700;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.login-logo p {
  color: var(--text-secondary);
  font-size: 14px;
  margin-top: 4px;
}

.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 15px;
  transition: var(--transition);
  outline: none;
}
.form-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108,92,231,0.15);
  background: rgba(255,255,255,0.08);
}
.form-group input::placeholder {
  color: var(--text-muted);
}

.btn {
  padding: 12px 24px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
}
.btn-primary {
  background: var(--accent-gradient);
  color: white;
  width: 100%;
  box-shadow: 0 4px 16px rgba(108,92,231,0.3);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(108,92,231,0.4);
}
.btn-primary:active {
  transform: translateY(0);
}
.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.btn-icon {
  padding: 8px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  font-size: 18px;
  line-height: 1;
}
.btn-icon:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
  border-color: var(--border-hover);
}
.btn-icon.danger:hover {
  background: rgba(225,112,85,0.15);
  color: var(--danger);
  border-color: rgba(225,112,85,0.3);
}

.login-error {
  color: var(--danger);
  font-size: 13px;
  text-align: center;
  margin-top: 12px;
  display: none;
}
.login-error.show { display: block; }

/* ============================================================================
   LAYOUT PRINCIPAL
   ============================================================================ */
.app-layout {
  display: flex;
  height: 100vh;
  position: relative;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.app-layout.show { opacity: 1; }

/* ============================================================================
   SIDEBAR
   ============================================================================ */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 16px;
  gap: 4px;
}

.sidebar-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 8px 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.sidebar-header .logo-small {
  width: 36px; height: 36px;
  background: var(--accent-gradient);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.sidebar-header h2 {
  font-size: 16px;
  font-weight: 700;
}
.sidebar-header .user-badge {
  margin-left: auto;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 500;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.sidebar-item:hover {
  background: var(--bg-card);
  color: var(--text-primary);
}
.sidebar-item.active {
  background: rgba(108,92,231,0.12);
  color: var(--accent-light);
}
.sidebar-item .icon {
  font-size: 18px;
  width: 24px;
  text-align: center;
}

.sidebar-section {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  padding: 16px 12px 6px;
}

.sidebar-storage {
  margin-top: auto;
  padding: 16px 12px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
}
.sidebar-storage .storage-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.sidebar-storage .storage-bar {
  height: 4px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.sidebar-storage .storage-bar-fill {
  height: 100%;
  background: var(--accent-gradient);
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* ============================================================================
   MAIN CONTENT
   ============================================================================ */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

/* ============================================================================
   TOOLBAR
   ============================================================================ */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 24px;
  background: var(--bg-glass);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  flex-wrap: wrap;
}

.toolbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 14px;
  color: var(--text-secondary);
  overflow: hidden;
  flex-wrap: wrap;
}
.breadcrumb a {
  color: var(--text-secondary);
  text-decoration: none;
  padding: 4px 8px;
  border-radius: 4px;
  transition: var(--transition);
  white-space: nowrap;
  cursor: pointer;
}
.breadcrumb a:hover {
  color: var(--text-primary);
  background: var(--bg-card);
}
.breadcrumb a.root {
  font-size: 16px;
  padding: 4px 6px;
}
.breadcrumb .separator {
  color: var(--text-muted);
  font-size: 14px;
}
.breadcrumb .current {
  color: var(--text-primary);
  font-weight: 500;
  padding: 4px 8px;
}

.toolbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  transition: var(--transition);
  min-width: 200px;
}
.search-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108,92,231,0.1);
  background: var(--bg-card-hover);
}
.search-box input {
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 14px;
  width: 100%;
}
.search-box input::placeholder {
  color: var(--text-muted);
}
.search-box .icon {
  font-size: 16px;
  color: var(--text-muted);
}

/* ============================================================================
   FILE LIST
   ============================================================================ */
.file-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px;
}

/* Grid View */
.file-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}

.file-card {
  background: var(--bg-glass);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 16px 16px;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  text-align: center;
}
.file-card:hover {
  background: var(--bg-card);
  border-color: var(--border-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.file-card:active {
  transform: translateY(0);
}
.file-card.selected {
  border-color: var(--accent);
  background: rgba(108,92,231,0.08);
  box-shadow: 0 0 0 1px var(--accent);
}

.file-card .file-icon {
  font-size: 40px;
  margin-bottom: 10px;
  line-height: 1;
}
.file-card .file-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  word-break: break-all;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.file-card .file-size {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}
.file-card .file-checkbox {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-radius: 6px;
  display: none;
  align-items: center;
  justify-content: center;
  background: var(--bg-secondary);
  transition: var(--transition);
  font-size: 12px;
}
.file-card.selected .file-checkbox,
.file-card.multi-select .file-checkbox {
  display: flex;
}
.file-card.selected .file-checkbox {
  background: var(--accent);
  border-color: var(--accent);
}

/* List View */
.file-list-view {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.file-list-header {
  display: flex;
  align-items: center;
  padding: 8px 16px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  gap: 16px;
}
.file-list-header .col-check { width: 36px; }
.file-list-header .col-name { flex: 3; cursor: pointer; }
.file-list-header .col-size { width: 100px; cursor: pointer; text-align: right; }
.file-list-header .col-date { width: 160px; cursor: pointer; }

.file-row {
  display: flex;
  align-items: center;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  gap: 16px;
}
.file-row:hover {
  background: var(--bg-card);
}
.file-row.selected {
  background: rgba(108,92,231,0.08);
}
.file-row .row-check {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  font-size: 12px;
}
.file-row.selected .row-check {
  background: var(--accent);
  border-color: var(--accent);
}
.file-row .row-icon { font-size: 22px; margin-right: 8px; }
.file-row .row-info {
  display: flex;
  align-items: center;
  flex: 3;
  min-width: 0;
  gap: 12px;
}
.file-row .row-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.file-row .row-size {
  width: 100px;
  text-align: right;
  font-size: 13px;
  color: var(--text-secondary);
  flex-shrink: 0;
}
.file-row .row-date {
  width: 160px;
  font-size: 13px;
  color: var(--text-secondary);
  flex-shrink: 0;
}

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--text-muted);
  text-align: center;
}
.empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
.empty-state h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 4px; }
.empty-state p { font-size: 14px; }

/* Drag & Drop Overlay */
.drag-overlay {
  position: absolute;
  inset: 0;
  background: rgba(108,92,231,0.08);
  border: 2px dashed var(--accent);
  border-radius: var(--radius);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
  pointer-events: none;
}
.drag-overlay.show {
  display: flex;
}
.drag-overlay span {
  font-size: 18px;
  color: var(--accent-light);
  font-weight: 600;
  background: var(--bg-secondary);
  padding: 16px 32px;
  border-radius: var(--radius);
  border: 1px solid rgba(108,92,231,0.3);
}

/* ============================================================================
   CONTEXT MENU
   ============================================================================ */
.context-menu {
  position: fixed;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px;
  min-width: 200px;
  box-shadow: var(--shadow);
  z-index: 1000;
  display: none;
  backdrop-filter: blur(20px);
}
.context-menu.show { display: block; }
.context-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.context-menu-item:hover {
  background: var(--bg-card);
  color: var(--text-primary);
}
.context-menu-item.danger:hover {
  background: rgba(225,112,85,0.12);
  color: var(--danger);
}
.context-menu-item .icon { font-size: 16px; width: 20px; text-align: center; }
.context-menu-separator {
  height: 1px;
  background: var(--border);
  margin: 4px 8px;
}

/* ============================================================================
   MODAL
   ============================================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.modal-overlay.show { display: flex; }

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 32px;
  width: 480px;
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
  animation: modalIn 0.25s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal h2 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 24px;
}

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 24px;
}

.btn-secondary {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
}
.btn-secondary:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-hover);
  color: var(--text-primary);
}

.btn-danger {
  background: var(--danger);
  color: white;
}
.btn-danger:hover {
  background: #d63031;
}

.upload-dropzone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 32px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  background: var(--bg-glass);
}
.upload-dropzone:hover,
.upload-dropzone.dragover {
  border-color: var(--accent);
  background: rgba(108,92,231,0.05);
}
.upload-dropzone .icon {
  font-size: 36px;
  margin-bottom: 12px;
}
.upload-dropzone p {
  color: var(--text-secondary);
  font-size: 14px;
}
.upload-dropzone .sub {
  color: var(--text-muted);
  font-size: 12px;
  margin-top: 4px;
}

/* ============================================================================
   TOAST
   ============================================================================ */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 20px;
  font-size: 14px;
  color: var(--text-primary);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: toastIn 0.3s ease;
  min-width: 250px;
  backdrop-filter: blur(12px);
}
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--info); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ============================================================================
   PREVIEW / EDITOR
   ============================================================================ */
.preview-modal .modal {
  width: 700px;
  max-height: 85vh;
}
.preview-content {
  background: rgba(0,0,0,0.3);
  border-radius: var(--radius-sm);
  padding: 16px;
  overflow: auto;
  max-height: 50vh;
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
  color: var(--text-secondary);
}
.preview-image {
  max-width: 100%;
  max-height: 60vh;
  border-radius: var(--radius-sm);
  display: block;
  margin: 0 auto;
}

/* ============================================================================
   LOADING
   ============================================================================ */
.loading-spinner {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================================
   RESPONSIVE
   ============================================================================ */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .toolbar { padding: 12px 16px; }
  .file-area { padding: 12px 16px; }
  .file-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .file-row .row-date { display: none; }
  .search-box { min-width: 140px; }
  .login-box { padding: 32px 24px; }
}
</style>
</head>
<body>
<div class="bg-animated"></div>

<!-- ========================================================================
     LOGIN
     ======================================================================== -->
<div class="login-container" id="loginContainer">
  <div class="login-box">
    <div class="login-logo">
      <div class="logo-icon">📁</div>
      <h1>NovaDrive</h1>
      <p>Gerenciador de Arquivos Moderno</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Usuário</label>
        <input type="text" id="loginUser" placeholder="Digite seu usuário" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="loginPass" placeholder="Digite sua senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Entrar</button>
      <div class="login-error" id="loginError">Usuário ou senha inválidos</div>
    </form>
  </div>
</div>

<!-- ========================================================================
     APP LAYOUT
     ======================================================================== -->
<div class="app-layout" id="appLayout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-small">📁</div>
      <h2>NovaDrive</h2>
      <span class="user-badge" id="userBadge">admin</span>
    </div>

    <button class="sidebar-item active" onclick="navigateTo('/')">
      <span class="icon">📂</span> Meus Arquivos
    </button>
    <button class="sidebar-item" onclick="openUpload()">
      <span class="icon">📤</span> Upload
    </button>
    <button class="sidebar-item" onclick="navigateTo('/.trash')">
      <span class="icon">🗑️</span> Lixeira
    </button>

    <div class="sidebar-section">Ações</div>
    <button class="sidebar-item" onclick="createFolder()">
      <span class="icon">📁</span> Nova Pasta
    </button>
    <button class="sidebar-item" onclick="toggleView()" id="viewToggle">
      <span class="icon">📋</span> Alternar Visualização
    </button>

    <div class="sidebar-storage">
      <div class="storage-label">
        <span>Armazenamento</span>
        <span id="storageText">—</span>
      </div>
      <div class="storage-bar">
        <div class="storage-bar-fill" id="storageBar" style="width:0%"></div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn-icon" onclick="goBack()" title="Voltar">←</button>
        <div class="breadcrumb" id="breadcrumb">
          <a class="root" onclick="navigateTo('/')">🏠</a>
        </div>
      </div>
      <div class="toolbar-right">
        <div class="search-box">
          <span class="icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Buscar arquivos..." oninput="searchFiles(this.value)">
        </div>
      </div>
    </div>

    <!-- File Area -->
    <div class="file-area" id="fileArea"
         ondragover="event.preventDefault(); event.currentTarget.closest('.main-content').querySelector('.drag-overlay').classList.add('show')"
         ondragleave="event.currentTarget.closest('.main-content').querySelector('.drag-overlay').classList.remove('show')"
         ondrop="handleDrop(event)">
      <div class="drag-overlay"><span>📥 Solte os arquivos aqui</span></div>
      <div id="fileContainer"></div>
    </div>
  </main>
</div>

<!-- ========================================================================
     TOASTS
     ======================================================================== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ========================================================================
     CONTEXT MENU
     ======================================================================== -->
<div class="context-menu" id="contextMenu">
  <button class="context-menu-item" data-action="download"><span class="icon">⬇️</span> Download</button>
  <button class="context-menu-item" data-action="rename"><span class="icon">✏️</span> Renomear</button>
  <button class="context-menu-item" data-action="copy"><span class="icon">📋</span> Copiar</button>
  <button class="context-menu-item" data-action="move"><span class="icon">✂️</span> Mover</button>
  <div class="context-menu-separator"></div>
  <button class="context-menu-item" data-action="preview"><span class="icon">👁️</span> Visualizar</button>
  <button class="context-menu-separator"></button>
  <button class="context-menu-item danger" data-action="delete"><span class="icon">🗑️</span> Excluir</button>
</div>

<!-- ========================================================================
     MODAL
     ======================================================================== -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ============================================================================
// STATE
// ============================================================================
const state = {
  token: null,
  user: null,
  currentPath: '/',
  currentItems: [],
  selected: new Set(),
  viewMode: 'grid',
  searchTerm: '',
  clipboard: null,
  contextPath: null,
  storage: { total: 0, used: 0 },
};

const API = window.location.origin + '/api';

// ============================================================================
// API HELPERS
// ============================================================================
async function api(method, path, body = null) {
  const opts = {
    method,
    headers: { 'Authorization': `Bearer ${state.token}` },
  };
  if (body instanceof FormData) {
    opts.body = body;
  } else if (body) {
    opts.headers['Content-Type'] = 'application/x-www-form-urlencoded';
    opts.body = new URLSearchParams(body);
  }
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || 'Erro na requisição');
  }
  return (res.headers.get('content-type') || '').includes('json') ? res.json() : res;
}

// ============================================================================
// AUTH
// ============================================================================
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  err.classList.remove('show');

  try {
    const payload = {
      username: document.getElementById('loginUser').value.trim(),
      password: document.getElementById('loginPass').value
    };
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(errData.detail || 'Usuário ou senha inválidos');
    }
    const data = await res.json();
    state.token = data.token;
    state.user = data.user;

    document.getElementById('loginContainer').classList.add('hidden');
    document.getElementById('appLayout').classList.add('show');
    document.getElementById('userBadge').textContent = data.user.role;
    
    loadFiles('/');
    loadStorage();
  } catch (e) {
    err.textContent = e.message || 'Usuário ou senha inválidos';
    err.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
};

// ============================================================================
// FILE NAVIGATION
// ============================================================================
async function loadFiles(path) {
  state.currentPath = path;
  state.selected.clear();
  const container = document.getElementById('fileContainer');
  container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';

  try {
    const params = new URLSearchParams({ path });
    if (state.searchTerm) params.set('search', state.searchTerm);
    const data = await api('GET', '/files?' + params);
    state.currentItems = data.items;
    renderFiles(data);
    renderBreadcrumbs(data.breadcrumbs);
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Erro ao carregar</h3><p>${e.message}</p></div>`;
  }
}

function navigateTo(path) {
  state.searchTerm = '';
  document.getElementById('searchInput').value = '';
  loadFiles(path);
}

function goBack() {
  const parts = state.currentPath.replace(/\/$/, '').split('/');
  parts.pop();
  navigateTo(parts.join('/') || '/');
}

// ============================================================================
// RENDER
// ============================================================================
function renderFiles(data) {
  const container = document.getElementById('fileContainer');
  
  if (data.items.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📂</div>
        <h3>Pasta vazia</h3>
        <p>Arraste arquivos para cá ou use o botão Upload</p>
      </div>
    `;
    return;
  }

  if (state.viewMode === 'grid') {
    renderGrid(data.items);
  } else {
    renderList(data.items);
  }
}

function renderGrid(items) {
  const container = document.getElementById('fileContainer');
  container.innerHTML = `<div class="file-grid">${items.map(item => `
    <div class="file-card${state.selected.has(item.path) ? ' selected' : ''}"
         data-path="${item.path}"
         ondblclick="${item.is_dir ? `navigateTo('${item.path}')` : `previewFile('${item.path}')`}"
         onclick="toggleSelect('${item.path}', event)"
         oncontextmenu="showContextMenu(event, '${item.path}')">
      <div class="file-checkbox">✓</div>
      <div class="file-icon">${iconFor(item)}</div>
      <div class="file-name">${item.name}</div>
      ${item.size_formatted ? `<div class="file-size">${item.size_formatted}</div>` : ''}
    </div>
  `).join('')}</div>`;
}

function renderList(items) {
  const container = document.getElementById('fileContainer');
  container.innerHTML = `
    <div class="file-list-view">
      <div class="file-list-header">
        <div class="col-check"></div>
        <div class="col-name" onclick="sortBy('name')">Nome</div>
        <div class="col-size" onclick="sortBy('size')">Tamanho</div>
        <div class="col-date" onclick="sortBy('date')">Modificado</div>
      </div>
      ${items.map(item => `
        <div class="file-row${state.selected.has(item.path) ? ' selected' : ''}"
             data-path="${item.path}"
             ondblclick="${item.is_dir ? `navigateTo('${item.path}')` : `previewFile('${item.path}')`}"
             onclick="toggleSelect('${item.path}', event)"
             oncontextmenu="showContextMenu(event, '${item.path}')">
          <div class="row-check">${state.selected.has(item.path) ? '✓' : ''}</div>
          <div class="row-info">
            <span class="row-icon">${iconFor(item)}</span>
            <span class="row-name">${item.name}</span>
          </div>
          <div class="row-size">${item.size_formatted || '—'}</div>
          <div class="row-date">${formatDate(item.modified)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderBreadcrumbs(crumbs) {
  const el = document.getElementById('breadcrumb');
  el.innerHTML = '<a class="root" onclick="navigateTo(\'/\')">🏠</a>';
  crumbs.forEach(c => {
    el.innerHTML += `<span class="separator">›</span><a onclick="navigateTo('${c.path}')">${c.name}</a>`;
  });
}

// ============================================================================
// ICONS
// ============================================================================
function iconFor(item) {
  if (item.is_dir) return '📁';
  const map = {
    image: '🖼️', video: '🎬', audio: '🎵', pdf: '📄',
    document: '📝', spreadsheet: '📊', archive: '📦', code: '💻',
    text: '📃', binary: '⚙️', disc: '💿', download: '🧲',
  };
  return map[item.icon] || '📄';
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ============================================================================
// SELECTION
// ============================================================================
function toggleSelect(path, event) {
  if (event.ctrlKey || event.metaKey) {
    if (state.selected.has(path)) state.selected.delete(path);
    else state.selected.add(path);
  } else {
    state.selected.clear();
    state.selected.add(path);
  }
  renderFiles({ items: state.currentItems, breadcrumbs: [] });
}

// ============================================================================
// SEARCH
// ============================================================================
let searchTimeout;
function searchFiles(term) {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    state.searchTerm = term;
    loadFiles(state.currentPath);
  }, 300);
}

// ============================================================================
// VIEW TOGGLE
// ============================================================================
function toggleView() {
  state.viewMode = state.viewMode === 'grid' ? 'list' : 'grid';
  document.getElementById('viewToggle').innerHTML = `<span class="icon">${state.viewMode === 'grid' ? '📋' : '📱'}</span> ${state.viewMode === 'grid' ? 'Lista' : 'Grade'}`;
  renderFiles({ items: state.currentItems, breadcrumbs: [] });
}

// ============================================================================
// CONTEXT MENU
// ============================================================================
function showContextMenu(event, path) {
  event.preventDefault();
  state.contextPath = path;
  if (!state.selected.has(path)) {
    state.selected.clear();
    state.selected.add(path);
    renderFiles({ items: state.currentItems, breadcrumbs: [] });
  }
  const menu = document.getElementById('contextMenu');
  menu.style.left = event.clientX + 'px';
  menu.style.top = event.clientY + 'px';
  menu.classList.add('show');
}

document.addEventListener('click', () => {
  document.getElementById('contextMenu').classList.remove('show');
});

document.getElementById('contextMenu').querySelectorAll('.context-menu-item').forEach(item => {
  item.onclick = () => {
    const action = item.dataset.action;
    const paths = state.selected.size > 1 ? Array.from(state.selected) : [state.contextPath || state.selected.values().next().value];
    if (paths.length === 0) return;
    switch (action) {
      case 'download': paths.forEach(p => downloadFile(p)); break;
      case 'rename': renameFile(paths[0]); break;
      case 'delete': deleteFiles(paths); break;
      case 'copy': state.clipboard = { action: 'copy', paths }; toast('📋 ' + paths.length + ' item(ns) copiado(s)', 'info'); break;
      case 'move': state.clipboard = { action: 'move', paths }; toast('✂️ ' + paths.length + ' item(ns) pronto(s) para mover', 'info'); break;
      case 'preview': previewFile(paths[0]); break;
    }
    document.getElementById('contextMenu').classList.remove('show');
  };
});

// ============================================================================
// ACTIONS
// ============================================================================
function openUpload() {
  showModal(`
    <h2>📤 Upload de Arquivos</h2>
    <div class="upload-dropzone" id="dropzone"
         ondragover="event.preventDefault(); this.classList.add('dragover')"
         ondragleave="this.classList.remove('dragover')"
         ondrop="event.preventDefault(); this.classList.remove('dragover'); uploadFiles(event.dataTransfer.files)"
         onclick="document.getElementById('fileInput').click()">
      <div class="icon">📥</div>
      <p>Arraste arquivos para cá ou clique para selecionar</p>
      <div class="sub">Múltiplos arquivos suportados</div>
      <input type="file" id="fileInput" multiple hidden onchange="uploadFiles(this.files)">
    </div>
    <div id="uploadProgress" style="margin-top:16px"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    </div>
  `);
}

async function uploadFiles(files) {
  const progress = document.getElementById('uploadProgress');
  const form = new FormData();
  form.append('path', state.currentPath);
  for (const f of files) form.append('files', f);
  
  progress.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div><p style="text-align:center;color:var(--text-secondary)">Enviando...</p>';
  
  try {
    const data = await api('POST', '/files/upload', form);
    progress.innerHTML = `<p style="color:var(--success)">✅ ${data.uploaded} arquivo(s) enviado(s)${data.failed ? `, ${data.failed} erro(s)` : ''}</p>`;
    setTimeout(() => { closeModal(); loadFiles(state.currentPath); }, 1500);
  } catch (e) {
    progress.innerHTML = `<p style="color:var(--danger)">❌ ${e.message}</p>`;
  }
}

function handleDrop(event) {
  event.preventDefault();
  document.querySelector('.drag-overlay').classList.remove('show');
  if (event.dataTransfer.files.length > 0) {
    openUpload();
    // Auto-set files
    setTimeout(() => {
      const input = document.getElementById('fileInput');
      if (input) {
        const dt = new DataTransfer();
        for (const f of event.dataTransfer.files) dt.items.add(f);
        input.files = dt.files;
        uploadFiles(dt.files);
      }
    }, 100);
  }
}

function createFolder() {
  showModal(`
    <h2>📁 Nova Pasta</h2>
    <div class="form-group">
      <label>Nome da pasta</label>
      <input type="text" id="folderName" placeholder="Ex: Documentos" autofocus>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="doCreateFolder()">Criar</button>
    </div>
  `);
  setTimeout(() => document.getElementById('folderName')?.focus(), 100);
}

async function doCreateFolder() {
  const name = document.getElementById('folderName').value.trim();
  if (!name) return;
  try {
    await api('POST', '/files/folder', { path: state.currentPath, name });
    closeModal();
    toast(`📁 Pasta "${name}" criada`, 'success');
    loadFiles(state.currentPath);
  } catch (e) {
    toast(`❌ ${e.message}`, 'error');
  }
}

function renameFile(path) {
  const item = state.currentItems.find(i => i.path === path);
  if (!item) return;
  showModal(`
    <h2>✏️ Renomear</h2>
    <div class="form-group">
      <label>Novo nome</label>
      <input type="text" id="renameInput" value="${item.name}" autofocus>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="doRename('${path}')">Renomear</button>
    </div>
  `);
  setTimeout(() => {
    const inp = document.getElementById('renameInput');
    inp?.focus();
    inp?.select();
  }, 100);
}

async function doRename(path) {
  const name = document.getElementById('renameInput').value.trim();
  if (!name) return;
  try {
    await api('PUT', '/files/rename', { path, new_name: name });
    closeModal();
    toast(`✏️ Renomeado para "${name}"`, 'success');
    loadFiles(state.currentPath);
  } catch (e) {
    toast(`❌ ${e.message}`, 'error');
  }
}

function deleteFiles(paths) {
  const count = paths.length;
  const isPermanent = state.currentPath === '/.trash';
  showModal(`
    <h2>${isPermanent ? '🗑️ Excluir Permanentemente' : '🗑️ Mover para Lixeira'}</h2>
    <p style="color:var(--text-secondary);line-height:1.5">
      ${isPermanent 
        ? `Tem certeza que deseja excluir permanentemente <strong>${count}</strong> item(ns)? Esta ação não pode ser desfeita.`
        : `Mover <strong>${count}</strong> item(ns) para a lixeira?`}
    </p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="doDelete('${paths.join(',')}', ${isPermanent})">${isPermanent ? 'Excluir' : 'Mover para Lixeira'}</button>
    </div>
  `);
}

async function doDelete(pathsStr, permanent) {
  const paths = pathsStr.split(',');
  try {
    for (const p of paths) {
      await api('DELETE', `/files?path=${encodeURIComponent(p)}&permanent=${permanent}`);
    }
    closeModal();
    toast(`🗑️ ${paths.length} item(ns) ${permanent ? 'excluído(s)' : 'movido(s) para lixeira'}`, 'success');
    loadFiles(state.currentPath);
  } catch (e) {
    toast(`❌ ${e.message}`, 'error');
  }
}

function downloadFile(path) {
  window.open(API + '/files/download?path=' + encodeURIComponent(path) + '&token=' + state.token, '_blank');
}

async function previewFile(path) {
  const item = state.currentItems.find(i => i.path === path);
  if (!item) return;
  
  // Image preview
  if (['image'].includes(item.icon)) {
    showModal(`
      <h2>${item.name}</h2>
      <img class="preview-image" src="${API}/files/download?path=${encodeURIComponent(path)}&token=${state.token}" alt="${item.name}">
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Fechar</button>
        <button class="btn btn-primary" onclick="downloadFile('${path}')">⬇️ Download</button>
      </div>
    `);
    return;
  }

  // Text preview
  try {
    const data = await api('GET', '/files/preview?path=' + encodeURIComponent(path));
    showModal(`
      <div class="preview-modal">
        <h2>${item.name}</h2>
        <div class="preview-content">${escapeHtml(data.content)}</div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Fechar</button>
          <button class="btn btn-primary" onclick="editFile('${path}')">✏️ Editar</button>
          <button class="btn btn-primary" onclick="downloadFile('${path}')">⬇️ Download</button>
        </div>
      </div>
    `);
  } catch (e) {
    // Download as fallback
    downloadFile(path);
  }
}

async function editFile(path) {
  try {
    const data = await api('GET', '/files/preview?path=' + encodeURIComponent(path));
    showModal(`
      <h2>✏️ Editando: ${data.name}</h2>
      <textarea id="editorContent" style="width:100%;min-height:300px;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;color:var(--text-primary);font-family:monospace;font-size:13px;resize:vertical">${escapeHtml(data.content)}</textarea>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveFile('${path}')">💾 Salvar</button>
      </div>
    `);
  } catch (e) {
    toast(`❌ ${e.message}`, 'error');
  }
}

async function saveFile(path) {
  const content = document.getElementById('editorContent').value;
  try {
    await api('PUT', '/files/save', { path, content });
    closeModal();
    toast('💾 Arquivo salvo!', 'success');
  } catch (e) {
    toast(`❌ ${e.message}`, 'error');
  }
}

// ============================================================================
// STORAGE
// ============================================================================
async function loadStorage() {
  try {
    const data = await api('GET', '/storage');
    state.storage = data;
    document.getElementById('storageText').textContent = `${data.used_formatted} / ${data.total_formatted}`;
    document.getElementById('storageBar').style.width = Math.min(data.percent_used, 100) + '%';
  } catch (e) {
    document.getElementById('storageText').textContent = '—';
  }
}

// ============================================================================
// KEYBOARD
// ============================================================================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModal();
    document.getElementById('contextMenu').classList.remove('show');
  }
  if (e.ctrlKey && e.key === 'v' && state.clipboard) {
    pasteClipboard();
  }
});

async function pasteClipboard() {
  if (!state.clipboard) return;
  const { action } = state.clipboard;
  const paths = state.clipboard.paths;
  
  const endpoint = action === 'copy' ? 'copy' : 'move';
  try {
    for (const p of paths) {
      await api('POST', `/files/${endpoint}`, { path: p, destination: state.currentPath });
    }
    toast(`✅ ${paths.length} item(ns) ${action === 'copy' ? 'copiado(s)' : 'movido(s)'} para cá`, 'success');
    state.clipboard = null;
    loadFiles(state.currentPath);
  } catch (e) {
    toast(`❌ ${e.message}`, 'error');
  }
}

// ============================================================================
// MODAL
// ============================================================================
function showModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// ============================================================================
// TOAST
// ============================================================================
function toast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(20px)';
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

// ============================================================================
// HELPERS
// ============================================================================
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================================================
// INIT - check if already logged in
// ============================================================================
// Check hash for token
if (window.location.hash) {
  try {
    const params = new URLSearchParams(window.location.hash.slice(1));
    const t = params.get('token');
    if (t) {
      state.token = t;
      state.user = { username: 'auto', role: 'user' };
      document.getElementById('loginContainer').classList.add('hidden');
      document.getElementById('appLayout').classList.add('show');
      loadFiles('/');
      loadStorage();
    }
  } catch(e) {}
}
</script>
